# Shared local emulation of an externally provisioned dsx_imds host agent.
global:
  spire:
    bundleConfigMap: spire-bundle

spire-server:
  enabled: false

spire-agent:
  fullnameOverride: dsx-imds-host-agent
  image:
    registry: ""
    repository: dsx-identity/dsx-spire-agent
    tag: 0.1.0
  extraEnvVars:
    - name: OTEL_SDK_DISABLED
      value: "true"
  server:
    address: dsx-identity-server.dsx-identity
  podLabels:
    identity.dsx.nvidia.com/host-agent: dsx-imds
  nodeAttestor:
    k8sPSAT:
      enabled: false
  customPlugins:
    nodeAttestor:
      dsx_imds:
        plugin_cmd: /opt/spire/plugins/dsx-imds-node-attestor-agent
        plugin_checksum: ""
        plugin_data:
          endpoint: http://e2e-operator-host-imds.dsx-identity.svc.cluster.local:18080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

spiffe-csi-driver:
  enabled: false

spiffe-oidc-discovery-provider:
  enabled: false
