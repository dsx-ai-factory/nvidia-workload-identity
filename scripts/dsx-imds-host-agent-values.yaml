# Shared local emulation of an externally provisioned dsx_imds host agent.
global:
  spire:
    bundleConfigMap: spire-bundle

spire-server:
  enabled: false

spire-agent:
  fullnameOverride: dsx-imds-host-agent
  extraEnvVars:
    - name: OTEL_SDK_DISABLED
      value: "true"
  server:
    address: dsx-identity-server.dsx-identity
  podLabels:
    identity.dsx.nvidia.com/host-agent: dsx-imds
  nodeAttestor:
    k8sPSAT:
      enabled: false
  customPlugins:
    nodeAttestor:
      dsx_imds:
        plugin_cmd: /opt/spire/plugins/dsx-imds-node-attestor-agent
        plugin_checksum: ""
        plugin_data:
          endpoint: http://e2e-operator-host-imds.dsx-identity.svc.cluster.local:18080
  initContainers:
    - name: install-dsx-imds-node-attestor-agent
      image: dsx-identity/dsx-imds-node-attestor-agent:0.1.0
      imagePullPolicy: IfNotPresent
      args:
        - /plugins/dsx-imds-node-attestor-agent
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: dsx-imds-agent-plugin
          mountPath: /plugins
  extraVolumes:
    - name: dsx-imds-agent-plugin
      emptyDir: {}
  extraVolumeMounts:
    - name: dsx-imds-agent-plugin
      mountPath: /opt/spire/plugins
      readOnly: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

spiffe-csi-driver:
  enabled: false

spiffe-oidc-discovery-provider:
  enabled: false
