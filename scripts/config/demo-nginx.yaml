apiVersion: v1
kind: Pod
metadata:
  name: demo-nginx
  namespace: default
  labels:
    app: demo-nginx
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: spiffe-csi
      mountPath: /var/run/secrets/spire.io
      readOnly: true
  volumes:
  - name: spiffe-csi
    csi:
      driver: csi.spiffe.io
      readOnly: true
  restartPolicy: Never
