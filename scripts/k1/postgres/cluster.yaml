apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  bootstrap:
    initdb:
      database: exchange
      owner: exchange
      postInitApplicationSQL:
        - |
          CREATE TABLE IF NOT EXISTS keysets (
              trust_domain VARCHAR(255) NOT NULL,
              key_id VARCHAR(255) NOT NULL,
              algorithm VARCHAR(50) NOT NULL,
              encrypted_keyset BYTEA NOT NULL,
              is_active BOOLEAN NOT NULL DEFAULT FALSE,
              created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
              PRIMARY KEY (trust_domain, key_id)
          )
        - CREATE INDEX IF NOT EXISTS idx_keysets_trust_domain ON keysets(trust_domain)
        - CREATE UNIQUE INDEX IF NOT EXISTS idx_keysets_one_active_per_domain ON keysets(trust_domain) WHERE is_active = TRUE
        - ALTER TABLE keysets OWNER TO exchange

  storage:
    size: 1Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
