apiVersion: v1
kind: Namespace
metadata:
  name: dsx-identity-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-nginx
  namespace: dsx-identity-e2e
  labels:
    app: e2e-nginx
    spiffe.nvidia.com/tenant: nca-0000000000000001
    spiffe.nvidia.com/service: dsx
    spiffe.nvidia.com/resource-type: host
    spiffe.nvidia.com/resource-id: e2e-nginx
spec:
  initContainers:
    - name: dsx-token-fetcher
      image: dsx-identity/dsx-token-fetcher:0.1.0
      imagePullPolicy: IfNotPresent
      restartPolicy: Always
      command:
        - /usr/local/bin/dsx-token-fetcher
      args:
        - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
        - --audience=spiffe://ds9.dsx.nvid.id/openbao
        - --svid-hint=dsx-pod
        - --output=/var/run/secrets/nvidia.com/dsx/token
        - --retries=10
        - --log-level=info
        - --exchange-service-url=http://spiffe-exchange.dsx-identity.svc.cluster.local:8080
      # Local E2E has no OTel collector. Production injection uses chart values.
      env:
        - name: OTEL_SDK_DISABLED
          value: "true"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      startupProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 1
        failureThreshold: 120
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      volumeMounts:
        - name: spiffe-csi
          mountPath: /var/run/secrets/spire.io
          readOnly: true
        - name: dsx-token
          mountPath: /var/run/secrets/nvidia.com/dsx
  containers:
    - name: nginx
      image: nginx:1.27.4-alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: spiffe-csi
          mountPath: /var/run/secrets/spire.io
          readOnly: true
        - name: dsx-token
          mountPath: /var/run/secrets/nvidia.com/dsx
          readOnly: true
    - name: identity-probe
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: spiffe-csi
          mountPath: /var/run/secrets/spire.io
          readOnly: true
  volumes:
    - name: spiffe-csi
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: dsx-token
      emptyDir: {}
  restartPolicy: Never
