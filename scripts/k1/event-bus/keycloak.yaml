apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: dsx-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --import-realm
            - --http-enabled=true
            - --hostname-strict=false
          env:
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50
            - name: SPIFFE_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spiffe-exchange-mqtt-oauth
                  key: client-secret
            - name: E2E_OBSERVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: event-bus-e2e-observer-oauth
                  key: client-secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /realms/event-bus/.well-known/openid-configuration
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /realms/event-bus/.well-known/openid-configuration
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: dsx-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
