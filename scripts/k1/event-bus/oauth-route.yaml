apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: event-bus-oauth-token
  namespace: dsx-identity
spec:
  parentRefs:
    - name: k1-gateway
      namespace: envoy-gateway-system
      sectionName: event-bus-oauth
  rules:
    - matches:
        - path:
            type: Exact
            value: /realms/event-bus/protocol/openid-connect/token
      backendRefs:
        - name: keycloak-service
          port: 8080
