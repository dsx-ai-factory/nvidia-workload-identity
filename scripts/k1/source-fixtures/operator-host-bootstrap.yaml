# Local E2E terminates the external DPU boundary on the control-plane agent.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: e2e-k1-operator-host-bootstrap
spec:
  className: dsx-identity-dsx-identity
  hint: dsx-imds
  spiffeIDTemplate: spiffe://{{ .TrustDomain }}/tenant/operator-1/service/dsx/host/k1-worker
  podSelector:
    matchLabels:
      identity.dsx.nvidia.com/operator-host-imds: e2e
