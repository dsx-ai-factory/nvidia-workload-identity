apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exchange-route
  namespace: spiffe-exchange
spec:
  parentRefs:
    - name: k1-gateway
      namespace: envoy-gateway-system
      sectionName: exchange-service
  rules:
    - backendRefs:
        - name: spiffe-exchange-service
          port: 8080
