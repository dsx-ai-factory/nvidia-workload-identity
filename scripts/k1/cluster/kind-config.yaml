# Kind cluster configuration for k1 (primary cluster)
# Uses default kindnet CNI - no OVN overhead needed
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k1
nodes:
- role: control-plane
  image: kindest/node:v1.31.9
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "spiffe.io/spire-node=true"
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

