apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsx-identity
resources:
  - ../namespace.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: spiffe-exchange-signing-keyset
    files:
      - signing-jwks.json=generated/signing-jwks.json
      - active-kid=generated/active-kid
  - name: spiffe-exchange-mqtt-oauth
    files:
      - client-id=../event-bus/generated/oauth/client-id
      - client-secret=../event-bus/generated/oauth/client-secret
