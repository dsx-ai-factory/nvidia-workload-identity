apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsx-identity
resources:
  - ../namespace.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: dsx-identity-keys-signing-keyset
    files:
      - signing-jwks.json=generated/signing-jwks.json
      - active-kid=generated/active-kid
