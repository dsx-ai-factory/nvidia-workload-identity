# k2 identity chart values for the Data Hall SPIRE and DSX Identity Keys shard
# Used by: make identities

global:
  dsx:
    jwtIssuer: "https://ds9.dsx.nvid.id"
  spire:
    trustDomain: "k2.sjc-1.nvidia.com"
    clusterName: "k2"
    jwtIssuer: "https://k2.sjc-1.nvidia.com"

spire:
  spire-server:
    customPlugins:
      nodeAttestor:
        dsx_imds:
          plugin_data:
            audience: spiffe://k2.sjc-1.nvidia.com/spire/server
            issuer: https://ds9.dsx.nvid.id
    controllerManager:
      # Kind's control-plane node emulates the external DPU boundary.
      parentIDTemplate: 'spiffe://{{ .TrustDomain }}/spire/agent/{{ if eq .NodeMeta.Name "k2-control-plane" }}k8s_psat/{{ .ClusterName }}/{{ .NodeMeta.UID }}{{ else }}dsx_imds/tenant/$OPERATOR_TENANT/bm/{{ .NodeMeta.Name }}{{ end }}'
identityKeys:
  shardID: k2
  nats:
    serverURL: nats://gateway.sjc-1.nvidia.com:4222
    auth:
      mode: none

podTokenFetcher:
  identityKeysURL: http://dsx-identity-keys.dsx-identity.svc.cluster.local:8080/v1/exchange

vmSupport:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  identityKeysProxy:
    target: TCP:dsx-identity-keys.dsx-identity.svc.cluster.local:8080
identityController:
  enabled: true
  replicaCount: 1
  # k2 bootstrap installs an API-only Kind fixture for the external DPU CRD.
  # dsx_dpu is supplied separately.
  dpuMetadataSelectors:
    - k8s:ns:dsx-identity
    - k8s:sa:e2e-dsx-imds
    - k8s:container-name:e2e-metadata-service
