# k2 identity chart values for the Data Hall SPIRE and Exchange shard
# Used by: make identities

global:
  spire:
    trustDomain: "k2.sjc-1.nvidia.com"
    clusterName: "k2"
    jwtIssuer: "spiffe://k2.sjc-1.nvidia.com"

spire:
  spire-server:
    customPlugins:
      nodeAttestor:
        dsx_imds:
          plugin_data:
            audience: spiffe://k2.sjc-1.nvidia.com/spire/server
            trust_domain: k2.sjc-1.nvidia.com
    controllerManager:
      # Kind's control-plane node emulates the external DPU boundary.
      parentIDTemplate: 'spiffe://{{ .TrustDomain }}/spire/agent/{{ if eq .NodeMeta.Name "k2-control-plane" }}k8s_psat/{{ .ClusterName }}/{{ .NodeMeta.UID }}{{ else }}dsx_imds/tenant/$OPERATOR_TENANT/host/{{ .NodeMeta.Name }}{{ end }}'
exchange:
  shardID: k2
  mqtt:
    brokerURL: tcp://gateway.sjc-1.nvidia.com:1883
    oauth2:
      tokenURL: http://gateway.sjc-1.nvidia.com:8080/realms/event-bus/protocol/openid-connect/token

podTokenFetcher:
  exchangeServiceURL: http://spiffe-exchange.dsx-identity.svc.cluster.local:8080/v1/exchange

vmSupport:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  exchangeProxy:
    target: TCP:spiffe-exchange.dsx-identity.svc.cluster.local:8080
identityController:
  enabled: true
  replicaCount: 1
  # k2 bootstrap installs an API-only Kind fixture for the external DPU CRD.
  # dsx_dpu is supplied separately.
  dpuTokenFetcherSelectors:
    - unix:uid:1000
    - unix:path:/usr/local/bin/dsx-token-fetcher
  dpuMetadataSelectors:
    - k8s:ns:dsx-identity
    - k8s:sa:e2e-nico-mds
