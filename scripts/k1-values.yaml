# k1 identity chart values for the primary SPIRE and DSX Identity Keys shard
# Used by: make identities

global:
  spire:
    trustDomain: "sjc-1.nvidia.com"
    clusterName: "k1"
    jwtIssuer: "spiffe://sjc-1.nvidia.com"

spire:
  spire-server:
    customPlugins:
      nodeAttestor:
        dsx_imds:
          plugin_data:
            audience: spiffe://sjc-1.nvidia.com/spire/server
            trust_domain: sjc-1.nvidia.com
    controllerManager:
      # Kind's control-plane node emulates the external DPU boundary.
      parentIDTemplate: 'spiffe://{{ .TrustDomain }}/spire/agent/{{ if eq .NodeMeta.Name "k1-control-plane" }}k8s_psat/{{ .ClusterName }}/{{ .NodeMeta.UID }}{{ else }}dsx_imds/tenant/$OPERATOR_TENANT/host/{{ .NodeMeta.Name }}{{ end }}'
identityKeys:
  shardID: k1
  nats:
    serverURL: nats://nats:4222
    auth:
      mode: none

podTokenFetcher:
  # The k1 E2E workload declares its token fetcher explicitly so this shard
  # exercises the same binary without selecting the Pod injection policy.
  enabled: false
