apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-registration-writer
  namespace: dsx-identity
---
apiVersion: v1
kind: Namespace
metadata:
  name: dsx-identity-admission-e2e
  labels:
    spiffe.nvidia.com/enabled: "true"
    spiffe.nvidia.com/vm-metadata-enabled: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-registration-writer
rules:
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterstaticentries", "clusterspiffeids"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-registration-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: e2e-registration-writer
subjects:
  - kind: ServiceAccount
    name: e2e-registration-writer
    namespace: dsx-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-vm-admission-writer
  namespace: dsx-identity-admission-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-vm-admission-writer
  namespace: dsx-identity-admission-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-vm-admission-writer
subjects:
  - kind: ServiceAccount
    name: kubevirt-controller
    namespace: kubevirt
