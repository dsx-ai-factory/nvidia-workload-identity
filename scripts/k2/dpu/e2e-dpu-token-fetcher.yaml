apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-dpu-token-fetcher
  namespace: dsx-identity
automountServiceAccountToken: false
---
# A Pod hosts the local external-agent boundary without modeling the DPU as a
# Kubernetes node. The real fetcher and DSX Identity Keys path run unchanged.
apiVersion: v1
kind: Pod
metadata:
  name: e2e-dpu-token-fetcher
  namespace: dsx-identity
  labels:
    identity.dsx.nvidia.com/dpu-token-fetcher: e2e
spec:
  serviceAccountName: e2e-dpu-token-fetcher
  nodeSelector:
    kubernetes.io/hostname: k2-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: dsx-token-fetcher
      image: dsx-identity/dsx-token-fetcher:0.1.0
      imagePullPolicy: IfNotPresent
      command:
        - /usr/local/bin/dsx-token-fetcher
      args:
        - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
        - --audience=spiffe://ds9.dsx.nvid.id/openbao
        - --svid-hint=dsx-dpu
        - --output=/run/secrets/nvidia.com/dsx/token
        - --identity-keys-url=http://dsx-identity-keys.dsx-identity.svc.cluster.local:8080/v1/exchange
        - --health-port=8080
      env:
        - name: OTEL_SDK_DISABLED
          value: "true"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumeMounts:
        - name: spiffe-csi
          mountPath: /var/run/secrets/spire.io
          readOnly: true
        - name: dsx-token
          mountPath: /run/secrets/nvidia.com
    - name: dpu-consumer
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumeMounts:
        - name: dsx-token
          mountPath: /run/secrets/nvidia.com
          readOnly: true
  volumes:
    - name: spiffe-csi
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: dsx-token
      emptyDir:
        medium: Memory
