apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}
  annotations:
    spiffe.nvidia.com/inject-dsx-token-fetcher: "true"
    spiffe.nvidia.com/token-audience: spiffe://ds9.dsx.nvid.id/openbao
    spiffe.nvidia.com/token-fetcher-health-port: {{ .Values.healthPort | quote }}
  labels:
    spiffe.nvidia.com/service: dsx
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.37.0-uclibc
      command: ["true"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
  restartPolicy: Never
