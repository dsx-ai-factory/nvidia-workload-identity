apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: e2e-l2bridge-network
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: tenant-tenant1
    objectSelector:
      matchLabels:
        kubevirt.io/domain: e2e-debian-vm-l2bridge
  matchConditions:
    - name: has-cloud-init-hook
      expression: object.spec.containers.exists(container, container.name == "hook-sidecar-0")
  mutations:
    # Upstream hook sidecars mount only their hook socket and ConfigMap.
    # Give this fixture its CNI allocation without API credentials.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [Object.spec.volumes{
                name: "e2e-l2bridge-network",
                downwardAPI: Object.spec.volumes.downwardAPI{
                  items: [Object.spec.volumes.downwardAPI.items{
                    path: "pod-networks",
                    fieldRef: Object.spec.volumes.downwardAPI.items.fieldRef{
                      apiVersion: "v1",
                      fieldPath: "metadata.annotations['k8s.ovn.org/pod-networks']"
                    }
                  }]
                }
              }],
              containers: [Object.spec.containers{
                name: "hook-sidecar-0",
                volumeMounts: [Object.spec.containers.volumeMounts{
                  name: "e2e-l2bridge-network",
                  mountPath: "/var/run/e2e-l2bridge",
                  readOnly: true
                }]
              }]
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: e2e-l2bridge-network
spec:
  policyName: e2e-l2bridge-network
