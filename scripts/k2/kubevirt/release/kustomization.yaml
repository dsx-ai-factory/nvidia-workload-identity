apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml
patches:
  - target:
      group: kubevirt.io
      version: v1
      kind: KubeVirt
      name: kubevirt
    patch: |-
      - op: add
        path: /spec/configuration/developerConfiguration/useEmulation
        value: true
      - op: add
        path: /spec/configuration/developerConfiguration/featureGates
        value: [Sidecar]
      - op: add
        path: /spec/configuration/network
        value:
          binding:
            l2bridge:
              domainAttachmentType: managedTap
