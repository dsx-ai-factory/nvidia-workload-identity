apiVersion: v1
kind: Namespace
metadata:
  name: mds-system
  labels:
    app.kubernetes.io/name: mds-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mds-network-setup
  namespace: mds-system
  labels:
    app: mds-network-setup
spec:
  selector:
    matchLabels:
      app: mds-network-setup
  template:
    metadata:
      labels:
        app: mds-network-setup
    spec:
      hostPID: true
      serviceAccountName: mds-network-setup
      containers:
      - name: mds-network-setup
        image: mds-network-setup:latest
        imagePullPolicy: IfNotPresent
        args:
        - --log-level=debug
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: run-containerd
          mountPath: /run/containerd
          readOnly: true
      volumes:
      - name: run-containerd
        hostPath:
          path: /run/containerd
          type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mds-network-setup
  namespace: mds-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mds-network-setup
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mds-network-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mds-network-setup
subjects:
- kind: ServiceAccount
  name: mds-network-setup
  namespace: mds-system
