# Kind cluster configuration for k2 (secondary cluster)
# Uses OVN-Kubernetes CNI for UDN support (required by metadata service and VM workloads)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k2
nodes:
- role: control-plane
  image: kindest/node:v1.31.9
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "spiffe.io/spire-node=true"
- role: worker
  image: kindest/node:v1.31.9
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "spiffe.io/spire-node=true"
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
  # Pod and service network ranges match OVN-Kubernetes defaults
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # Disable default CNI and kube-proxy so OVN-Kubernetes can provide them
  disableDefaultCNI: true
  kubeProxyMode: none
