apiVersion: v1
kind: Namespace
metadata:
  name: dsx-identity-spire-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-spire-client
  namespace: dsx-identity-spire-e2e
  labels:
    spiffe.nvidia.com/service: dsx
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: identity-probe
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
        - name: spiffe-csi
          mountPath: /var/run/secrets/spire.io
          readOnly: true
  volumes:
    - name: spiffe-csi
      csi:
        driver: csi.spiffe.io
        readOnly: true
