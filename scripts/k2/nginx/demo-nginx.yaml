# Demo nginx pod for k2 cluster
# Exchange service URL points to k1 via DNS (gateway.sjc-1.nvidia.com configured in CoreDNS)
apiVersion: v1
kind: Pod
metadata:
  name: demo-nginx
  namespace: default
  labels:
    app: demo-nginx
    spiffe.nvidia.com/tenant: tenant1
    spiffe.nvidia.com/service: internal
spec:
  # Reduce ndots from default 5 to 2 to avoid slow DNS lookups.
  # With ndots:5, hostnames with <5 dots trigger search suffix expansion,
  # causing queries to forward to external DNS and timeout before resolving.
  dnsConfig:
    options:
    - name: ndots
      value: "2"
  initContainers:
  - name: spiffe-init
    image: spiffe-token-fetcher:latest
    imagePullPolicy: Never
    args:
    - "-socket=unix:///var/run/secrets/spire.io/spire-agent.sock"
    - "-audience=spiffe://tenant1.sjc-1.internal.nvidia.com"
    - "-output=/var/run/secrets/nvidia.com/spiffe/token"
    - "-retries=3"
    - "-verbose=true"
    - "-exit-after-fetch=true"
    - "-exchange-service-url=http://gateway.sjc-1.nvidia.com:8080"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 64Mi
    volumeMounts:
    - name: spiffe-csi
      mountPath: /var/run/secrets/spire.io
      readOnly: true
    - name: spiffe-tokens
      mountPath: /var/run/secrets/nvidia.com/spiffe
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    volumeMounts:
    - name: spiffe-tokens
      mountPath: /var/run/secrets/nvidia.com/spiffe
      readOnly: true
    env:
    - name: SPIFFE_TOKEN_PATH
      value: "/var/run/secrets/nvidia.com/spiffe/token"
  - name: spiffe-sidecar
    image: spiffe-token-fetcher:latest
    imagePullPolicy: Never
    args:
    - "-socket=unix:///var/run/secrets/spire.io/spire-agent.sock"
    - "-audience=spiffe://tenant1.sjc-1.internal.nvidia.com"
    - "-output=/var/run/secrets/nvidia.com/spiffe/token"
    - "-retries=3"
    - "-verbose=true"
    - "-exchange-service-url=http://gateway.sjc-1.nvidia.com:8080"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 64Mi
    volumeMounts:
    - name: spiffe-csi
      mountPath: /var/run/secrets/spire.io
      readOnly: true
    - name: spiffe-tokens
      mountPath: /var/run/secrets/nvidia.com/spiffe
  volumes:
  - name: spiffe-csi
    csi:
      driver: csi.spiffe.io
      readOnly: true
  - name: spiffe-tokens
    emptyDir: {}
  restartPolicy: Never

