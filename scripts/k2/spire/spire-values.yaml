# SPIRE Helm Values for k2 (workload cluster)

global:
  spire:
    trustDomain: "k2.sjc-1.nvidia.com"
    clusterName: "k2"
    jwtIssuer: "spiffe://k2.sjc-1.nvidia.com"
    caSubject:
      country: "US"
      organization: "SPIFFE"
      commonName: "SPIRE Server CA"

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        pod-workloads:
          podSelector:
            matchExpressions:
            - key: spiffe.nvidia.com/tenant
              operator: Exists
            - key: spiffe.nvidia.com/service
              operator: Exists
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/tenant/{{ index .PodMeta.Labels \"spiffe.nvidia.com/tenant\" }}/service/{{ index .PodMeta.Labels \"spiffe.nvidia.com/service\" }}/pod/{{ .PodMeta.UID }}"
        vm-workloads:
          podSelector:
            matchLabels:
              kubevirt.io: virt-launcher
            matchExpressions:
            - key: spiffe.nvidia.com/tenant
              operator: Exists
            - key: spiffe.nvidia.com/service
              operator: Exists
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/tenant/{{ index .PodMeta.Labels \"spiffe.nvidia.com/tenant\" }}/service/{{ index .PodMeta.Labels \"spiffe.nvidia.com/service\" }}/vm/{{ .PodMeta.UID }}"

  federation:
    enabled: true
    bundleEndpoint:
      enabled: true
      port: 8443
    tls:
      spire:
        enabled: false
      certManager:
        enabled: true
        issuer:
          create: false
        certificate:
          dnsNames:
            - gateway.k2.sjc-1.nvidia.com
          issuerRef:
            kind: ClusterIssuer
            name: ca-issuer

spiffe-oidc-discovery-provider:
  tls:
    spire:
      enabled: false
