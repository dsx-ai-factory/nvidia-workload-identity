# SPIRE Helm Values for k2 (workload cluster)
# Based on working configuration with bundle endpoint for federation

global:
  spire:
    trustDomain: "k2.sjc-1.k8s2-control.nvidia.com"
    clusterName: "k2"
    jwtIssuer: "spiffe://k2.sjc-1.k8s2-control.nvidia.com"
    caSubject:
      country: "US"
      organization: "SPIFFE"
      commonName: "SPIRE Server CA"

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        default:
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/{{ if index .PodMeta.Labels \"spiffe.nvidia.com/domain\" }}domain/{{ index .PodMeta.Labels \"spiffe.nvidia.com/domain\" }}/{{ end }}{{ .PodMeta.Namespace }}/pod/{{ .PodMeta.UID }}"
        vm-workloads:
          podSelector:
            matchLabels:
              kubevirt.io: virt-launcher
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/{{ if index .PodMeta.Labels \"spiffe.nvidia.com/domain\" }}domain/{{ index .PodMeta.Labels \"spiffe.nvidia.com/domain\" }}/{{ end }}vmaas/vm/{{ .PodMeta.UID }}"

  federation:
    enabled: true
    bundleEndpoint:
      enabled: true
      port: 8443
    tls:
      spire:
        enabled: false
      certManager:
        enabled: true
        issuer:
          create: false
        certificate:
          dnsNames:
            - gateway.k2.sjc-1.k8s2-control.nvidia.com
          issuerRef:
            kind: ClusterIssuer
            name: ca-issuer

spiffe-oidc-discovery-provider:
  tls:
    spire:
      enabled: false
