# KubeVirt maps this no-RBAC account onto the virt-launcher Pod through the
# vm-service-account volume below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-debian-vm
automountServiceAccountToken: false
---
apiVersion: launchlayer.nvidia.com/v1alpha1
kind: VirtualInstance
metadata:
  name: e2e-debian-vm
  annotations:
    launchlayer.nvidia.com/org-id: tenant-2
spec:
  instance_id: e2e-debian-vm
  node_name: k2-worker
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: e2e-debian-vm
  labels:
    app: e2e-vm
    kubevirt.io/vm: e2e-debian-vm
    tenant: tenant1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: e2e-debian-vm
        app: e2e-vm
        tenant: tenant1
        spiffe.nvidia.com/service: dsx
      annotations:
        spiffe.nvidia.com/inject-dsx-imds: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k2-worker
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinit
            - disk:
                bus: virtio
                readonly: true
              # KubeVirt requires a disk target for the serviceAccount volume.
              name: vm-service-account
          interfaces:
            - name: default
              bridge: {}
        features:
          acpi:
            enabled: true
        resources:
          requests:
            memory: 2Gi
          limits:
            memory: 2Gi
      networks:
        - name: default
          multus:
            networkName: tenant-tenant1/tenant-tenant1-network
            default: true
      volumes:
        - containerDisk:
            image: quay.io/containerdisks/debian:13
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: e2e-debian-vm-cloud-init
            networkDataSecretRef:
              name: e2e-debian-vm-cloud-init
          name: cloudinit
        - name: vm-service-account
          serviceAccount:
            serviceAccountName: e2e-debian-vm
---
# Launch Layer normally publishes the virt-launcher Pod UID to VirtualInstance status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-launch-layer-status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-launch-layer-status
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["launchlayer.nvidia.com"]
    resources: ["virtualinstances/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-launch-layer-status
subjects:
  - kind: ServiceAccount
    name: e2e-launch-layer-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-launch-layer-status
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-launch-layer-status
spec:
  template:
    spec:
      # Publish status through the node network because the tenant UDN cannot reach the API service.
      hostNetwork: true
      restartPolicy: OnFailure
      serviceAccountName: e2e-launch-layer-status
      containers:
        - name: status-publisher
          image: docker.io/alpine/k8s:1.32.2@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
          command: ["/bin/sh", "-c"]
          args:
            - |
              kubectl wait --for=create pod -l kubevirt.io=virt-launcher --timeout=300s
              uid=$(kubectl get pod -l kubevirt.io=virt-launcher -o jsonpath='{.items[0].metadata.uid}')
              kubectl patch virtualinstance e2e-debian-vm --subresource=status --type=merge -p "{\"status\":{\"pod_uid\":\"$uid\"}}"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
