# KubeVirt maps this no-RBAC account onto the virt-launcher Pod through the
# vm-service-account volume below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-debian-vm
automountServiceAccountToken: false
---
apiVersion: e2e.dsx-identity.nvidia.com/v1alpha1
kind: LaunchLayerSourceFixture
metadata:
  name: e2e-vm-source-e2e-debian-vm
spec:
  type: vm
  tenantID: tenant-2
  resourceID: e2e-debian-vm
  role: database
  # This parent must match the VM nodeSelector and its dsx_imds host agent.
  parentID: k2-worker
  holder:
    namespace: tenant-tenant1
    serviceAccount: e2e-debian-vm
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: e2e-debian-vm
  labels:
    app: e2e-vm
    kubevirt.io/vm: e2e-debian-vm
    tenant: tenant1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: e2e-debian-vm
        app: e2e-vm
        tenant: tenant1
        spiffe.nvidia.com/service: dsx
      annotations:
        spiffe.nvidia.com/inject-dsx-imds: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k2-worker
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinit
            - disk:
                bus: virtio
                readonly: true
              # KubeVirt requires a disk target for the serviceAccount volume.
              name: vm-service-account
          interfaces:
            - name: default
              bridge: {}
        features:
          acpi:
            enabled: true
        resources:
          requests:
            memory: 2Gi
          limits:
            memory: 2Gi
      networks:
        - name: default
          multus:
            networkName: tenant-tenant1/tenant-tenant1-network
            default: true
      volumes:
        - containerDisk:
            image: quay.io/containerdisks/debian:13
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: e2e-debian-vm-cloud-init
            networkDataSecretRef:
              name: e2e-debian-vm-cloud-init
          name: cloudinit
        - name: vm-service-account
          serviceAccount:
            serviceAccountName: e2e-debian-vm
