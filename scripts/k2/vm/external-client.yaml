apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-external-client
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-external-client
  labels:
    app: e2e-external-client
spec:
  serviceAccountName: e2e-external-client
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: external-client
      image: nicolaka/netshoot:v0.16
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: ssh-key
          mountPath: /run/dsx-identity-ssh
          readOnly: true
    - name: e2e-probe
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
  volumes:
    - name: ssh-key
      secret:
        secretName: e2e-ubuntu-vm-e2e-ssh
        defaultMode: 0400
        items:
          - key: id_ed25519
            path: id_ed25519
