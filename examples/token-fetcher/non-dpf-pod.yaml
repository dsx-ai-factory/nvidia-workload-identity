apiVersion: v1
kind: Pod
metadata:
  name: dsx-token-fetcher-example
  labels:
    # The host-cluster SPIRE registration selects this workload independently.
    spiffe.nvidia.com/service: dsx
  annotations:
    # The admission policy uses these annotations to inject and configure the fetcher.
    spiffe.nvidia.com/inject-dsx-token-fetcher: "true"
    spiffe.nvidia.com/token-audience: spiffe://ds9.dsx.nvid.id/openbao
spec:
  containers:
    - name: token-reader
      image: busybox:1.37.0
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      # Readiness proves the injected fetcher populated the shared volume.
      readinessProbe:
        exec:
          command: ["test", "-s", "/run/secrets/nvidia.com/dsx/token"]
        periodSeconds: 2
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
