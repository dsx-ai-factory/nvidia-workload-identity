name: Promote RC

on:
  workflow_dispatch:
    inputs:
      rc_version:
        description: QA-approved RC version (X.Y.Z-rc.N)
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: >-
      github.repository == 'dsx-ai-factory/nvidia-workload-identity' &&
      github.ref == 'refs/heads/master' &&
      vars.DSX_RELEASE_MODE == 'rc-promotion'
    permissions:
      contents: read
      actions: read
      deployments: read
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/promote-rc.yml@db3780bff4b2cbf90ba9117a63e41ddea066791b
    with:
      rc_version: ${{ inputs.rc_version }}
    secrets:
      RC_PROMOTION_APP_PRIVATE_KEY: ${{ secrets.RC_PROMOTION_APP_PRIVATE_KEY }}
      RC_PROMOTION_SOURCE_NGC_KEY: ${{ secrets.RC_PROMOTION_SOURCE_NGC_KEY }}
      RC_PROMOTION_DESTINATION_NGC_KEY: ${{ secrets.RC_PROMOTION_DESTINATION_NGC_KEY }}
