name: Release candidate

on:
  push:
    branches: [release/1.15.0]
  pull_request:
    branches: [master, "release/**"]

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/release-candidate-checks.yml@7cfe73f4f82a9f6cdbc7c55eae9ecf37e11835ea

  release:
    if: github.event_name == 'push' && github.repository == 'dsx-ai-factory/project-dsx-identity'
    permissions:
      contents: write
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/release-candidate.yml@7cfe73f4f82a9f6cdbc7c55eae9ecf37e11835ea
