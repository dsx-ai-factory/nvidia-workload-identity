name: Release candidate

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  dsx-component-ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: dsx-component-ci
    if: >-
      github.repository == 'dsx-ai-factory/nvidia-workload-identity' &&
      startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/release-candidate-publish.yml@be29428a696f1f1be890602895acefc8ebc762e8
    with:
      artifact-publisher: external
      promotion-manifest: false
      runner: ubuntu-latest
