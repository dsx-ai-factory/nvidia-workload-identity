name: RC workflow checks

on:
  pull_request:
    branches: [master, "release/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install release test dependencies
        run: npm ci --ignore-scripts --prefix .github/rc-tests
      - name: Test RC version guards and local Git releases
        run: npm test --prefix .github/rc-tests
