name: Fern Docs CI

on:
  push:
    branches: [master, "pull-request/[0-9]+"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-ci.yml@a86675cddd27de0cc3182d2a33db75a26c20bb90
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      fern_cli_version: '5.65.2'
      runner: ubuntu-24.04
      navigation_file: index.yml
      docs_paths: |
        docs
        examples
        cmd
        charts
        kata-uds-proxy
      frozen_versions: true
      native_checks: true
