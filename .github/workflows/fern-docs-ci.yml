name: Fern Docs CI

on:
  push:
    branches: [master, "pull-request/[0-9]+"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-ci.yml@b81a8d1962e689667bcd83d9bacf51aff05f6e59
    with:
      runner: ubuntu-24.04
      navigation_file: index.yml
      docs_paths: |
        docs
        examples
        cmd
        charts
        kata-uds-proxy
      frozen_versions: true
      native_checks: true
