name: Fern Docs CI

on:
  push:
    branches: [master, "pull-request/[0-9]+"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-docs-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # Keep this version in step with fern/fern.config.json.
      - name: Install Fern CLI
        run: npm install -g fern-api@5.186.0

      # Registered versions point at <tag>-content/ pages that are generated, not
      # committed. Without them fern check fails on every push after the first
      # registration. The loop does nothing until then.
      - name: Extract frozen version content
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            python3 tools/fern-frozen-content "$version" "fern/versions/${version}-content" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          done

      # index.yml names READMEs outside docs/, so the checks run over the
      # published pages instead of a single directory.
      - name: Check MDX safety
        run: python3 tools/check-docs-mdx docs examples cmd charts kata-uds-proxy

      # Fern reads any local file a page names. The path checker takes directories
      # only, so stage the navigation, fern/, and every listed page first.
      # stage-fern-site rejects page paths that leave the repository. --allow
      # accepts the fern/docs.yml entry that points at the navigation file.
      - name: Check docs paths
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          python3 tools/stage-fern-site --with-fern . "$stage"
          python3 tools/check-docs-paths --allow '../index.yml' "$stage"

      - name: Fern check
        run: fern check

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links
