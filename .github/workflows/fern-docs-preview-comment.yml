# The shared workflow validates the collector artifact and publishes with
# default-branch configuration. Copy-pr-bot must vet PR pages before collection.
name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Fern Docs Preview: Build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  preview:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-comment.yml@81eb7c69680d2b3eca9142e73fcd2fe311949cf5
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      fern_cli_version: '5.65.2'
      runner: ubuntu-24.04
      navigation_file: index.yml
      docs_paths: |
        docs
        examples
        cmd
        charts
        kata-uds-proxy
      frozen_versions: true
      native_checks: true
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
