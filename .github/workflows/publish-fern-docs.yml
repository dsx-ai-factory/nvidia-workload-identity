# Publishes the Fern documentation site for stable releases and manual version tags.
#
# Automatic publication skips pre-releases and tags containing a hyphen. An
# explicit manual version tag may include a pre-release or build suffix. Each
# registered version serves frozen pages extracted from its tag. The newest is stamped
# "Latest" at publish time. The stamp is not persisted.
#
# Triggers:
#   release published: promotion creates the stable release with an App token or
#     PAT, which starts this workflow. A release created with GITHUB_TOKEN would
#     not.
#   workflow_dispatch: publishes the supplied version tag, or the latest stable
#     release.
#
# For each selected tag the workflow also:
#   1. Generates fern/versions/<tag>.yml from the tag's index.yml
#   2. Adds a version entry to fern/docs.yml, sorted by version descending
#   3. Keeps the selected tag and the newest other versions, up to MAX_VERSIONS
#   4. Opens a PR that saves the registry changes to master after publishing
#
# The tag must contain index.yml. Tags cut before the navigation existed cannot
# be registered.
#
# Required configuration: repository or organization secret FERN_TOKEN. Actions
# must be allowed to create pull requests.

name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, such as v1.16.0-rc.5. Leave empty to use the latest stable release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Runs queue instead of cancelling. A cancelled run could skip the registry PR
# and leave its version permanently unregistered.
concurrency:
  group: fern-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MAX_VERSIONS: 3

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      # The GitHub-hosted image provides yq. Fail early if it does not.
      - name: Check yq
        run: yq --version

      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not determine the release tag"
            exit 1
          fi
          # Explicit manual inputs may select version tags with pre-release or build suffixes.
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ -z "${INPUT_TAG}" ]; then
            if [ "${RELEASE_PRERELEASE}" = "true" ] || [[ "$TAG" == *-* ]]; then
              echo "::notice::Skipping ${TAG}. Only stable releases are published automatically."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${TAG}' is not a stable semver tag (expected vMAJOR.MINOR.PATCH)"
              exit 1
            fi
          elif ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' must be vMAJOR.MINOR.PATCH with an optional pre-release or build suffix"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag '${TAG}' does not exist in this repository"
            exit 1
          fi
          if ! git cat-file -e "refs/tags/${TAG}:index.yml" 2>/dev/null; then
            echo "::error::Tag '${TAG}' has no index.yml, so its docs cannot be registered"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $TAG"

      - name: Register new version from tag
        if: steps.resolve.outputs.publish == 'true'
        env:
          TAG_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eo pipefail

          if [ -f "fern/versions/${TAG_VERSION}.yml" ]; then
            echo "Version ${TAG_VERSION} already registered, skipping"
            exit 0
          fi

          mkdir -p fern/versions
          # Page paths in the tag's index.yml are repository paths. The frozen
          # content step below keeps them under <tag>-content/. yq rewrites only
          # the path values, so quoted values and other text stay intact.
          export TAG_VERSION
          git show "refs/tags/${TAG_VERSION}:index.yml" | \
            yq '(.. | select(tag == "!!map" and has("path")) | .path) |= env(TAG_VERSION) + "-content/" + .' \
            > "fern/versions/${TAG_VERSION}.yml"

          EXPR='.products[0].versions += [{"display-name": env(TAG_VERSION),'
          EXPR+=' "path": "versions/" + env(TAG_VERSION) + ".yml",'
          EXPR+=' "slug": env(TAG_VERSION), "availability": "stable"}]'
          yq -i "$EXPR" fern/docs.yml

          # Sort all version entries by semver descending
          SORTED_SLUGS=$(yq '.products[0].versions[].slug' fern/docs.yml | sort -rV)
          yq -i '.products[0].versions = []' fern/docs.yml
          for slug in $SORTED_SLUGS; do
            export slug
            yq -i '.products[0].versions += [{"display-name": env(slug), "path": "versions/" + env(slug) + ".yml", "slug": env(slug), "availability": "stable"}]' fern/docs.yml
          done

          echo "--- docs.yml versions after insert and sort ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      - name: Prune old versions
        if: steps.resolve.outputs.publish == 'true'
        env:
          TAG_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eo pipefail
          TOTAL=$(yq '.products[0].versions | length' fern/docs.yml)

          if [ "$TOTAL" -le "$MAX_VERSIONS" ]; then
            echo "Only $TOTAL versions, nothing to prune (keeping $MAX_VERSIONS)"
            exit 0
          fi

          # Keep the selected tag even when a manual run selects an older version.
          PRUNED=$(yq ".products[0].versions | map(select(.slug != strenv(TAG_VERSION))) | .[$((MAX_VERSIONS - 1)):][].slug" fern/docs.yml)

          for slug in $PRUNED; do
            export slug
            yq -i '.products[0].versions |= map(select(.slug != strenv(slug)))' fern/docs.yml
            rm -f "fern/versions/${slug}.yml"
            echo "Pruned $slug"
          done

          echo "--- docs.yml versions after prune ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      - name: Extract frozen version content
        if: steps.resolve.outputs.publish == 'true'
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            python3 tools/fern-frozen-content "$version" "fern/versions/${version}-content" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "Extracted pages from $version"
          done

      # The Fern CLI runs with FERN_TOKEN and reads any local file a page names.
      - name: Check docs paths before using FERN_TOKEN
        if: steps.resolve.outputs.publish == 'true'
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          python3 tools/stage-fern-site --with-fern . "$stage"
          python3 tools/check-docs-paths --allow '../index.yml' "$stage"

      - name: Stamp newest version as Latest
        if: steps.resolve.outputs.publish == 'true'
        run: |
          cp fern/docs.yml "$RUNNER_TEMP/docs.yml.preStamp"
          NEWEST=$(yq '.products[0].versions[0].display-name' fern/docs.yml)
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "null" ]; then
            export NEWEST
            yq -i '.products[0].versions[0].display-name = "Latest · " + env(NEWEST)' fern/docs.yml
          fi
          echo "--- docs.yml versions after stamp ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      # This job holds FERN_TOKEN and write access. It needs no package cache.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.resolve.outputs.publish == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      # Keep this version in step with fern/fern.config.json.
      - name: Install Fern CLI
        if: steps.resolve.outputs.publish == 'true'
        run: npm install -g fern-api@5.186.0

      - name: Publish docs
        if: steps.resolve.outputs.publish == 'true'
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        working-directory: ./fern
        run: |
          set -eo pipefail
          fern generate --docs 2>&1 | tee "$RUNNER_TEMP/fern-output.log"
          # Fern prints "Published docs to URL", sometimes followed by " (URL)".
          URL=$(sed -n 's/.*Published docs to \(https:[^[:space:]]*\).*/\1/p' "$RUNNER_TEMP/fern-output.log" | tail -1)
          if [ -n "$URL" ]; then
            echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore unstamped docs.yml for persistence
        if: steps.resolve.outputs.publish == 'true'
        run: cp "$RUNNER_TEMP/docs.yml.preStamp" fern/docs.yml

      # A PR opened with GITHUB_TOKEN does not start other workflows, so Fern Check
      # does not run on it. signoff satisfies the DCO check.
      - name: Open PR for version registry changes
        if: steps.resolve.outputs.publish == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: master
          branch: docs/fern-register-${{ steps.resolve.outputs.tag }}
          delete-branch: true
          sign-commits: true
          signoff: true
          commit-message: "docs(fern): register Fern docs ${{ steps.resolve.outputs.tag }}"
          title: "docs(fern): register Fern docs ${{ steps.resolve.outputs.tag }}"
          body: |
            Registers `${{ steps.resolve.outputs.tag }}` in the Fern docs version registry, keeping up to ${{ env.MAX_VERSIONS }} versions including the selected tag.

            Generated by the `Publish Fern Docs` workflow.
          add-paths: |
            fern/versions/v*.yml
            fern/docs.yml
