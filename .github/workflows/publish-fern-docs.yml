# The shared publisher queues releases and registers frozen versions.
# It owns publish concurrency. Callers must not add another concurrency group.
name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, such as v1.16.0-rc.5. Leave empty to use the latest stable release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/publish-fern-docs.yml@a86675cddd27de0cc3182d2a33db75a26c20bb90
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      fern_cli_version: '5.65.2'
      runner: ubuntu-24.04
      navigation_file: index.yml
      docs_paths: |
        docs
        examples
        cmd
        charts
        kata-uds-proxy
      tag: ${{ inputs.tag || '' }}
      register_versions: true
      native_checks: true
      max_versions: 3
      publish: true
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
