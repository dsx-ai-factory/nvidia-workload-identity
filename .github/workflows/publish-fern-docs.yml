# The shared publisher queues stable releases and registers frozen versions.
# It owns publish concurrency. Callers must not add another concurrency group.
name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to publish, such as v1.15.0. Leave empty to use the latest release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/publish-fern-docs.yml@81eb7c69680d2b3eca9142e73fcd2fe311949cf5
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      fern_cli_version: '5.65.2'
      runner: ubuntu-24.04
      navigation_file: index.yml
      docs_paths: |
        docs
        examples
        cmd
        charts
        kata-uds-proxy
      tag: ${{ inputs.tag || '' }}
      register_versions: true
      native_checks: true
      max_versions: 3
      publish: true
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
