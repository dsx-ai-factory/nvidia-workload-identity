name: CI

on:
  workflow_call:
    outputs:
      images:
        description: Image inventory used by product CI
        value: ${{ jobs.images.outputs.images }}
  push:
    branches: [master, "pull-request/[0-9]+"]

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

defaults:
  run:
    shell: bash

jobs:
  images:
    name: Image inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: images
        run: echo "images=$(jq -ce . .github/images.json)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/mise-data
      RUSTUP_HOME: ${{ github.workspace }}/.mise/mise-data/rustup
      CARGO_HOME: ${{ github.workspace }}/.mise/mise-data/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.4.28
          install_args: --locked
          # Rustup and Cargo live under MISE_DATA_DIR so the cache includes them.
          cache_key_prefix: mise-rustup-v1
      - run: make validate

  e2e:
    name: E2E
    needs: validate
    runs-on: linux-amd64-cpu32
    timeout-minutes: 240
    env:
      # Use the existing split-kubeconfig path for parallel cluster creation.
      KIND_DIND_SERVICE_HOST: localhost
      KUBECONFIG: ${{ github.workspace }}/.kube/kind-k1:${{ github.workspace }}/.kube/kind-k2
      ZOT_DATA_DIR: ${{ github.workspace }}/.cache/zot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        id: tools
        with:
          version: 2026.4.28
          install_args: --locked
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: zot-cache
        with:
          # The full Zot storage exceeds GitHub's 10 GB per-entry limit.
          path: ${{ env.ZOT_DATA_DIR }}/library
          key: zot-dockerhub-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('local-e2e-tests/local-registry/zot-config.json') }}
      - name: Prepare host networking and virtualization
        run: |
          # The AWS image omits VRF and holds its matching extra module package.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-change-held-packages \
            "linux-modules-extra-$(uname -r)"
          # Primary UDN gateways require VRF support in the host kernel.
          for module in openvswitch vport-geneve nft_socket vrf tun vhost_net; do
            sudo modprobe "$module"
          done
          test -d /sys/module/openvswitch
          test -d /sys/module/nft_socket
          test -d /sys/module/vrf
          docker info
          df -h
          free -h
      - name: Configure Zot upstream mirror
        run: |
          # shellcheck disable=SC2016
          mise exec -- jq --arg mirror 'https://dc.local.gha-runners.nvidia.com' \
            '.extensions.sync.registries[0].urls[1] = $mirror' \
            local-e2e-tests/local-registry/zot-config.json > "$RUNNER_TEMP/zot-config.json"
          echo "ZOT_CONFIG_FILE=$RUNNER_TEMP/zot-config.json" >> "$GITHUB_ENV"
      - name: Docker Hub mirror diagnostics
        run: |
          curl -sS --connect-timeout 5 --max-time 15 -D - -o /dev/null \
            https://dc.local.gha-runners.nvidia.com/v2/library/busybox/manifests/1.37.0-uclibc || true
          curl -sS --connect-timeout 5 --max-time 15 -D - -o /dev/null \
            https://dc.local.gha-runners.nvidia.com/v2/nicolaka/netshoot/manifests/v0.16 || true
      # The checked-out CI commit is stable, so skip hashing nine image contexts.
      - run: make -j install SKAFFOLD_RUN="mise exec -- skaffold run --iterative-status-check=false --tag=${GITHUB_SHA}"
        id: install
      - run: make test
      - name: VM UDN and IMDS evidence
        run: |
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get pods -n tenant-tenant1 -o json | mise exec -- jq \
            '.items[] | {name: .metadata.name, uid: .metadata.uid, node: .spec.nodeName,
              hostNetwork: (.spec.hostNetwork // false), networks: .metadata.annotations["k8s.ovn.org/pod-networks"]}'
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get virtualinstance e2e-debian-vm -n tenant-tenant1 -o json | \
            mise exec -- jq '{spec, status}'
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n tenant-tenant1 -l kubevirt.io=virt-launcher \
            -c dsx-imds-network-setup --tail=20 --prefix
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n tenant-tenant1 -l kubevirt.io=virt-launcher \
            -c metadata-service --tail=20 --prefix
      - name: E2E failure diagnostics
        if: failure() && steps.tools.outcome == 'success'
        run: |
          docker logs --tail=400 dsx-identity-registry || true
          for context in kind-k1 kind-k2; do
            mise exec -- kubectl --context "$context" --request-timeout=10s get nodes -o wide || true
            mise exec -- kubectl --context "$context" --request-timeout=10s get pods -A -o wide || true
            mise exec -- kubectl --context "$context" --request-timeout=10s get events -A --sort-by=.lastTimestamp || true
          done
          mise exec -- kubectl --context kind-k2 --request-timeout=10s get kubevirt -n kubevirt || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s get vm,vmi -n tenant-tenant1 || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get virtualinstance e2e-debian-vm -n tenant-tenant1 -o yaml || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get clusterstaticentries || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n tenant-tenant1 job/e2e-launch-layer-status \
            -c status-publisher --tail=100 || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n dsx-identity -l app.kubernetes.io/name=dsx-identity-controller --tail=100 || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n tenant-tenant1 -l kubevirt.io=virt-launcher \
            -c metadata-service --tail=200 --prefix || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get pods -n tenant-tenant1 -o json | mise exec -- jq \
            '.items[] | {name: .metadata.name, node: .spec.nodeName,
              hostNetwork: (.spec.hostNetwork // false), networks: .metadata.annotations["k8s.ovn.org/pod-networks"]}' || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            exec -n tenant-tenant1 e2e-external-client -c external-client -- \
            sh -c 'ip -4 route; curl -k -sS --connect-timeout 3 --max-time 5 https://10.96.0.1/healthz' || true
          mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            logs -n ovn-kubernetes -l app=ovnkube-node -c ovnkube-node --tail=100 --prefix || true
          for node in k2-control-plane k2-worker; do
            docker exec "$node" ip -4 rule || true
            docker exec "$node" ip -4 route show table all || true
            docker exec "$node" sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.breth0.rp_filter || true
            docker exec "$node" nft list table inet ovn-kubernetes || true
          done
          for pod in $(mise exec -- kubectl --context kind-k2 --request-timeout=10s \
            get pods -n ovn-kubernetes -l app=ovs-node -o name); do
            mise exec -- kubectl --context kind-k2 --request-timeout=10s \
              exec -n ovn-kubernetes "$pod" -- ovs-ofctl dump-flows breth0 || true
          done
      - name: Clean up E2E clusters
        if: always() && steps.tools.outcome == 'success'
        run: make clean
      - name: Stop Zot before caching
        if: always() && steps.install.outcome == 'success' && steps.zot-cache.outputs.cache-hit != 'true'
        id: stop-zot
        run: |
          docker stop dsx-identity-registry
          sudo chown -R "$(id -u):$(id -g)" "$ZOT_DATA_DIR/library"
          du -sh "$ZOT_DATA_DIR/library"
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.stop-zot.outcome == 'success'
        with:
          path: ${{ env.ZOT_DATA_DIR }}/library
          key: ${{ steps.zot-cache.outputs.cache-primary-key }}

  secret-detection:
    name: Secret detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dsx-ai-factory/dsx-github-actions/.github/actions/trufflehog-scan@a252aa5208a0176d9c0789150d197e8a99a36b21
        with:
          head: ${{ github.sha }}
          version: 3.91.1
          extra-args: --results=verified,unknown
          post-pr-comment: "false"
          fail-on-findings: "true"

  container-scan:
    name: Container scan (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Read image build arguments
        id: args
        env:
          BUILD_ARGS: ${{ toJSON(matrix.buildArgs || fromJSON('{}')) }}
        run: |
          {
            echo 'build-args<<EOF'
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$BUILD_ARGS"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and scan both platforms
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/docker-build@c7feba104dc74b5a0a95ba6daa2692e5e9218971
        with:
          image: local/${{ matrix.name }}
          tags: ${{ github.sha }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          build-args: ${{ steps.args.outputs.build-args }}
          platforms: linux/amd64,linux/arm64
          push: "false"
          buildkit-config: ""
          security-scan-enabled: "true"
          security-scan-fail-on-critical: "true"
          security-scan-config: ${{ matrix.name == 'dsx-spire-server' && '.github/grype.yaml' || '' }}

  release-checks:
    name: RC contract checks
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/release-candidate-checks.yml@8a37bf6fbeace3af5e5f5857f65e0da25cdf7537
