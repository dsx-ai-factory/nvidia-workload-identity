name: "Fern Docs Preview: Build"

on:
  push:
    branches: ["pull-request/[0-9]+"]
    paths:
      - 'index.yml'
      - 'docs/**'
      - 'fern/**'
      - 'tools/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.github/workflows/fern-docs-preview-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-build.yml@3193ddf344c5ff4854863061ac95685728bbcfdd
    with:
      runner: ubuntu-24.04
      navigation_file: index.yml
