name: "Fern Docs Preview: Build"

on:
  push:
    branches: ["pull-request/[0-9]+"]
    paths:
      - 'index.yml'
      - 'docs/**'
      - '.github/fern-docs.yml'
      - '.github/versions/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.github/workflows/fern-docs-preview-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-build.yml@ff256deef9bbbfb595f33e6e6e914d341b27cf2d
    with:
      runner: ubuntu-24.04
      navigation_file: index.yml
