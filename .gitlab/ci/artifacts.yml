variables:
  VAULT_ADDR: https://prod.vault.nvidia.com
  VAULT_NAMESPACE: gfn-cds
  VAULT_NAMESPACE_DUP: gfn-cds
  VAULT_MOUNT_PATH: auth/jwt/gitlab
  VAULT_SECRETS_DEST: ./secrets/secrets
  NGC_REGISTRY_VAULT_KEY: dsx-components-dev
  NGC_REGISTRY_REQUIRE_STG: "false"
  NGC_IMAGE_PATH: "nvcr.io/0837451325059433/components-dev"
  NGC_HELM_PATH: "0837451325059433/components-dev"
  NGC_DSX_COMPONENTS_PUSH_KEY: "$NGC_REGISTRY_TOKEN"
  PULSE_SCAN_VAULT_KEY: dsx
  SLACK_CHANNEL_ID: C09VC8R4E92
  SLACK_MESSAGE: |
    CI pipeline complete.
    Project: `${CI_PROJECT_NAME}` | Status: `${CI_JOB_STATUS}` | Branch: `${CI_COMMIT_REF_NAME}`
    Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: `${CI_COMMIT_AUTHOR}`
    Commit: `${CI_COMMIT_TITLE}`
  PIPELINE_TRIGGER: "13"
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"

verify-rc:
  extends: [.release-tools]
  stage: release
  needs:
    - {job: "docker-push-ngc:dsx-token-fetcher", artifacts: false}
    - {job: "docker-push-ngc:dsx-identity-keys", artifacts: false}
    - {job: "docker-push-ngc:metadata-service", artifacts: false}
    - {job: "docker-push-ngc:dsx-imds-network-setup", artifacts: false}
    - {job: "docker-push-ngc:dsx-identity-keys-proxy-csi", artifacts: false}
    - {job: "docker-push-ngc:dsx-identity-controller", artifacts: false}
    - {job: "docker-push-ngc:dsx-spire-server", artifacts: false}
    - {job: "docker-push-ngc:dsx-spire-agent", artifacts: false}
    - {job: "docker-push-ngc:dsx-kata-uds-proxy", artifacts: false}
    - {job: helm-push-ngc-dsx-identity, artifacts: false}
    - {job: helm-push-ngc-dsx-imds, artifacts: false}
    - {job: helm-push-ngc-dsx-token-fetcher, artifacts: false}
    - {job: helm-push-ngc-dsx-token-fetcher-example, artifacts: false}
  script:
    - python3 .release-tools/.github/actions/promote-rc/gitlab.py verify --policy .gitlab/rc-promotion.json
  artifacts:
    paths: [rc-promotion-manifest.json]
    expire_in: 2 years
  rules:
    - if: '$CI_COMMIT_TAG'

compute-next-release-version:
  stage: init
  extends: [.nvcf-cds-runner-tags]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      test "$GITLAB_PUBLISH_ARTIFACTS" = true
      test "$CI_COMMIT_REF_PROTECTED" = true
      [[ "$CI_COMMIT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
      printf 'NEXT_VERSION=%s\nSKIP_SEMANTIC_RELEASE=false\n' "${CI_COMMIT_TAG#v}" > release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_TAG'

# GitHub creates release tags. Builds reuse the exact mirrored tag.
.common_scripts:
  setup_git_version_tag:
    - test "$(git rev-parse "refs/tags/${CI_COMMIT_TAG}^{commit}")" = "$CI_COMMIT_SHA"
    - git describe --tags --exact-match HEAD
    - git config user.name CI
    - git config user.email ci_dummy@nvidia.com
    - git add .
    - git stash
    - test -z "$(git status --porcelain)"

commitlint:
  extends:
    - .commitlint
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none

.helm-package:
  needs:
    - compute-next-release-version
  before_script:
    - |
      test "${NEXT_VERSION:?}" = "${CI_COMMIT_TAG#v}"
      export HELM_CHART_VERSION="$NEXT_VERSION"
      yq -i '
        .version = strenv(HELM_CHART_VERSION) |
        .appVersion = strenv(HELM_CHART_VERSION) |
        .annotations."dsx.nvidia.com/source-revision" = strenv(CI_COMMIT_SHA)
      ' "${CC_HELM_CHART_PATH}/Chart.yaml"
      if [[ "$CC_HELM_CHART_PATH" == charts/dsx-identity ]]; then
        yq -i '.spire."spire-server".image.tag = strenv(HELM_CHART_VERSION)' "${CC_HELM_CHART_PATH}/values.yaml"
      fi

.helm-package-rule:
  rules:
    - !reference [.rules-push-or-mr, rules]

.helm-push-ngc-rule:
  rules:
    - !reference [.rules-push-or-mr-manual, rules]

.helm-push-ngc:
  stage: publish
  resource_group: ngc-chart-${CI_JOB_NAME}-${CI_COMMIT_TAG}
  extends:
    - .nvcf-cds-runner-tags
  variables:
    NGC_DSX_COMPONENTS_PUSH_KEY: $NGC_REGISTRY_TOKEN

.docker-publish:
  # Serialize this project's check and copy for each immutable RC image.
  resource_group: ngc-image-${DOCKER_IMAGE_NAME}-${CI_COMMIT_TAG}
  allow_failure: false
  variables:
    PUSH_TO_NGC: "true"
    PUSH_LATEST_TAG: "false"
  script:
    - |
      set -euo pipefail
      test "$NGC_REGISTRY_REQUIRE_STG" = false
      test "$PUSH_LATEST_TAG" = false
      test -z "${SKIP_PUSH_TO_NGC_PROD:-}"
      test "$IMAGE_TAG" = "${CI_COMMIT_TAG#v}"
      source_image="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"
      target_image="${NGC_IMAGE_PATH}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"
      source_digest="$(regctl manifest head "$source_image")"
      [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
      echo "$NGC_REGISTRY_TOKEN" | docker login -u '$oauthtoken' --password-stdin "$NGC_REGISTRY"
      lookup_error="$(mktemp)"
      trap 'rm -f "$lookup_error"' EXIT
      if docker buildx imagetools inspect --raw "$target_image" > /dev/null 2> "$lookup_error"; then
        target_digest="$(regctl manifest head "$target_image")"
        if [[ "$target_digest" != "$source_digest" ]]; then
          echo "RC image already exists with a different digest. Refusing to overwrite."
          exit 1
        fi
      else
        # Match the shared promotion verifier's confirmed-absence responses only.
        message="$(<"$lookup_error")"
        message="${message#ERROR: }"
        case "$message" in
          "$target_image: not found" | "$target_image: manifest unknown" | \
          "$target_image: manifest unknown: manifest unknown" | \
          'manifest unknown' | 'manifest unknown: manifest unknown' | \
          'MANIFEST_UNKNOWN: manifest unknown')
            ;;
          *)
            echo "Unable to verify RC image absence. Refusing to publish."
            exit 1
            ;;
        esac
        regctl image copy "${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}@${source_digest}" "$target_image"
      fi
      test "$(regctl manifest head "$target_image")" = "$source_digest"
      echo "Verified $target_image at $source_digest"

.container-build:
  stage: build
  resource_group: gitlab-image-${DOCKER_IMAGE_NAME}-${CI_COMMIT_TAG}
  extends:
    - .build-image-dind
  variables:
    # The GitLab registry rejects BuildKit's default provenance manifest.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  script:
    - export EXTRA_BUILD_ARGS="${EXTRA_BUILD_ARGS:-} --label org.opencontainers.image.revision=${CI_COMMIT_SHA}"
    - !reference [.build-image-dind, script]
  needs:
    - compute-next-release-version

