{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName | default "spiffe-postgres" }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.postgres.instances | default 1 }}
  imageName: {{ .Values.postgres.image | default "ghcr.io/cloudnative-pg/postgresql:16" }}

  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | default "exchange" }}
      owner: {{ .Values.postgres.user | default "exchange" }}
      postInitApplicationSQL:
        - |
          CREATE TABLE IF NOT EXISTS domain_keys (
              trust_domain VARCHAR(255) NOT NULL,
              key_id VARCHAR(255) NOT NULL,
              algorithm VARCHAR(50) NOT NULL,
              encrypted_key TEXT NOT NULL,
              master_key_id VARCHAR(255) NOT NULL,
              is_active BOOLEAN NOT NULL DEFAULT FALSE,
              created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
              PRIMARY KEY (trust_domain, key_id)
          )
        - CREATE INDEX IF NOT EXISTS idx_domain_keys_trust_domain ON domain_keys(trust_domain)
        - CREATE UNIQUE INDEX IF NOT EXISTS idx_domain_keys_one_active_per_domain ON domain_keys(trust_domain) WHERE is_active = TRUE

  storage:
    size: {{ .Values.postgres.storage.size | default "1Gi" }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu | default "100m" }}
      memory: {{ .Values.postgres.resources.requests.memory | default "256Mi" }}
    limits:
      cpu: {{ .Values.postgres.resources.limits.cpu | default "500m" }}
      memory: {{ .Values.postgres.resources.limits.memory | default "512Mi" }}
{{- end }}
