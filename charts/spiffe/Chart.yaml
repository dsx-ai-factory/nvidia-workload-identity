apiVersion: v2
name: spiffe
description: Full SPIFFE stack — SPIRE, exchange service, workload/VM support
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: spiffe-spire
    version: "0.1.0"
    repository: "file://../spiffe-spire"
    condition: spiffe-spire.enabled
  - name: spiffe-exchange
    version: "0.1.0"
    repository: "file://../spiffe-exchange"
    condition: spiffe-exchange.enabled
  - name: spiffe-workload-support
    version: "0.1.0"
    repository: "file://../spiffe-workload-support"
    condition: spiffe-workload-support.enabled
  - name: spiffe-vm-support
    version: "0.1.0"
    repository: "file://../spiffe-vm-support"
    condition: spiffe-vm-support.enabled
