# Default values for the SPIFFE SPIRE umbrella chart.
# This chart wraps the official spiffe/spire and spiffe/spire-crds Helm charts
# as dependencies, setting sensible defaults for NVIDIA DSX deployments.
#
# Override global.spire.trustDomain and global.spire.clusterName per cluster.

# -- Global values shared across all subcharts
global:
  installAndUpgradeHooks:
    # Re-enabled: umbrella chart bundles CRDs + SPIRE in single release,
    # so hooks can reference CRDs within the same sync cycle.
    enabled: true
  spire:
    # -- SPIFFE trust domain (MUST override per cluster)
    trustDomain: "dsx.nvidia.com"
    # -- Cluster name for SPIRE registration
    clusterName: "dsx-cluster"
    # -- JWT issuer URI (defaults to spiffe://trustDomain)
    jwtIssuer: ""
    caSubject:
      country: "US"
      organization: "NVIDIA"
      commonName: "SPIRE Server CA"

# ---- spire-crds subchart ----
spire-crds:
  enabled: true

# ---- spire subchart ----
spire:
  enabled: true

  spire-server:
    defaultX509SvidTTL: "1h"
    defaultJwtSvidTTL: "5m"

    controllerManager:
      identities:
        clusterSPIFFEIDs:
          # SPIFFE identity for the exchange service
          exchange-service:
            podSelector:
              matchLabels:
                app: spiffe-exchange
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: dsx-spiffe
            spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
          # SPIFFE identity for workloads with tenant/service labels
          pod-workloads:
            podSelector:
              matchExpressions:
              - key: spiffe.nvidia.com/tenant
                operator: Exists
              - key: spiffe.nvidia.com/service
                operator: Exists
            spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/tenant/{{ index .PodMeta.Labels \"spiffe.nvidia.com/tenant\" }}/service/{{ index .PodMeta.Labels \"spiffe.nvidia.com/service\" }}/pod/{{ .PodMeta.UID }}"

    federation:
      enabled: false

  spiffe-oidc-discovery-provider:
    tls:
      spire:
        enabled: false

  spiffe-csi-driver:
    # CSI driver must be enabled for exchange service to mount SPIRE agent socket
    enabled: true
