suite: DPF child chart resources
values:
  - values.yaml
templates:
  - templates/dpu-service.yaml
  - templates/dpu-token-fetcher-service.yaml
tests:
  - it: renders only DSX IMDS by default
    set:
      dpuService.identityKeysURL: https://identity.example.com/v1/exchange
    template: templates/dpu-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DPUService
      - equal:
          path: metadata.name
          value: dsx-imds
      - equal:
          path: spec.helmChart.source.chart
          value: dsx-imds
      - equal:
          path: spec.helmChart.values.metadataService.identityKeysURL
          value: https://identity.example.com/v1/exchange

  - it: passes the ordered shared pull secrets to IMDS
    set:
      dpuService:
        imds:
          enabled: true
          helmChart:
            repoURL: https://helm.example.com
            version: 2.0.0
      imagePullSecrets:
        - name: registry-one
        - name: registry-two
    template: templates/dpu-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.helmChart.source.version
          value: 2.0.0
        documentIndex: 0
      - equal:
          path: spec.helmChart.values.imagePullSecrets
          value:
            - name: registry-one
            - name: registry-two
        documentIndex: 0

  - it: passes an empty shared pull secret list to IMDS
    template: templates/dpu-service.yaml
    asserts:
      - equal:
          path: spec.helmChart.values.imagePullSecrets
          value: []
        documentIndex: 0

  - it: omits the optional IMDS socket override when empty
    set:
      dpuService.imds.spireSocketPath: ""
    template: templates/dpu-service.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.helmChart.values.metadataService.spireSocketPath

  - it: omits DSX IMDS when disabled
    set:
      dpuService.imds.enabled: false
    template: templates/dpu-service.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects DSX IMDS without an externally reachable Identity Keys endpoint
    set:
      dpuService.identityKeysURL: ""
    template: templates/dpu-service.yaml
    asserts:
      - failedTemplate:
          errorMessage: dpuService.identityKeysURL is required

  - it: passes the ordered shared pull secrets and settings to token fetcher
    set:
      dpuService.tokenFetcher.enabled: true
      dpuService.identityKeysURL: https://identity.example.com/v1/exchange
      dpuService.observabilityEnv:
        OTEL_EXPORTER_OTLP_ENDPOINT: http://collector.example.com:4318
        OTEL_METRICS_EXPORTER: prometheus
      imagePullSecrets:
        - name: registry-one
        - name: registry-two
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: dsx-token-fetcher
      - equal:
          path: spec.helmChart.values.imagePullSecrets
          value:
            - name: registry-one
            - name: registry-two
      - equal:
          path: spec.helmChart.values.tokenFetcher.identityKeysURL
          value: https://identity.example.com/v1/exchange
      - equal:
          path: spec.helmChart.values.tokenFetcher.svidHint
          value: dpu-service
      - equal:
          path: spec.helmChart.values.tokenFetcher.env.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://collector.example.com:4318
      - equal:
          path: spec.helmChart.values.tokenFetcher.env.OTEL_METRICS_EXPORTER
          value: none

  - it: passes an empty shared pull secret list to the token fetcher
    set:
      dpuService.tokenFetcher.enabled: true
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - equal:
          path: spec.helmChart.values.imagePullSecrets
          value: []

  - it: passes explicit token fetcher chart version socket and SVID hint
    set:
      dpuService:
        tokenFetcher:
          enabled: true
          spireSocketPath: /custom/spire/agent.sock
          svidHint: custom-dpu
          helmChart:
            repoURL: https://helm.example.com
            version: 4.0.0
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - equal:
          path: spec.helmChart.source.version
          value: 4.0.0
      - equal:
          path: spec.helmChart.values.tokenFetcher.spireSocketPath
          value: /custom/spire/agent.sock
      - equal:
          path: spec.helmChart.values.tokenFetcher.svidHint
          value: custom-dpu

  - it: passes an empty DPU SVID hint to disable exact selection
    set:
      dpuService.tokenFetcher.enabled: true
      dpuService.tokenFetcher.svidHint: ""
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - equal:
          path: spec.helmChart.values.tokenFetcher.svidHint
          value: ""

  - it: rejects token fetcher admission without a SPIRE socket
    set:
      dpuService.tokenFetcher.enabled: true
      dpuService.tokenFetcher.spireSocketPath: ""
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - failedTemplate:
          errorMessage: dpuService.tokenFetcher.spireSocketPath is required

  - it: omits the token fetcher service when disabled
    set:
      dpuService.imds.enabled: false
    template: templates/dpu-token-fetcher-service.yaml
    asserts:
      - hasDocuments:
          count: 0
