{{- if and .Values.spire.enabled (index .Values.spire "spire-server").enabled }}
{{- $className := printf "%s-%s" .Release.Namespace .Release.Name -}}
{{- $tenant := include "dsx-identity.operatorTenant" . -}}
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ printf "%s-%s-operator-pod" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "operator-pod") | nindent 4 }}
spec:
  className: {{ $className | quote }}
  hint: dsx-pod
  spiffeIDTemplate: {{ printf "spiffe://{{ .TrustDomain }}/tenant/%s/service/{{ index .PodMeta.Labels \"spiffe.nvidia.com/service\" }}/bm/{{ .NodeMeta.Name }}/pod/{{ .PodMeta.UID }}{{ with index .PodMeta.Labels \"spiffe.nvidia.com/role\" }}/role/{{ . }}{{ end }}" $tenant | quote }}
  podSelector:
    matchExpressions:
      - key: spiffe.nvidia.com/service
        operator: Exists
{{- end }}
