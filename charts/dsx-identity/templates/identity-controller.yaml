{{- if .Values.identityController.enabled }}
{{- $name := include "dsx-identity.identityControllerFullname" . -}}
{{- $serviceName := include "dsx-identity.defaultServiceName" . -}}
{{- $values := .Values.identityController -}}
{{- $dpuMetadataSelectors := $values.dpuMetadataSelectors -}}
{{- if and .Values.dpuService.imds.enabled (empty $dpuMetadataSelectors) -}}
{{- $dpuMetadataSelectors = list
      (printf "k8s:ns:%s" .Release.Namespace)
      (printf "k8s:sa:%s" (required "dpuService.workload.serviceAccountName is required" .Values.dpuService.workload.serviceAccountName))
      (printf "k8s:container-name:%s" (required "dpuService.workload.containerName is required" .Values.dpuService.workload.containerName)) -}}
{{- end -}}
{{- $imageTag := $values.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsx-identity.identityControllerLabels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsx-identity.identityControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["provisioning.dpu.nvidia.com"]
    resources: ["dpus"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["launchlayer.nvidia.com"]
    resources: ["virtualinstances", "baremetalinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterstaticentries"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Reports invalid source input after removing its stale SPIRE entry.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Controller-runtime leader election when the controller has multiple replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsx-identity.identityControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsx-identity.identityControllerLabels" . | nindent 4 }}
spec:
  replicas: {{ $values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsx-identity.identityControllerName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dsx-identity.identityControllerLabels" . | nindent 8 }}
        spiffe.nvidia.com/service: {{ $serviceName | quote }}
      {{- with (include "dsx-identity.observabilityPodAnnotations" (dict "root" . "containerNames" "controller")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dsx-identity.identityControllerName" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ $values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          command:
            - /usr/local/bin/dsx-identity-controller
          args:
            - --trust-domain={{ required "global.spire.trustDomain is required" $.Values.global.spire.trustDomain }}
            - --service={{ $serviceName }}
            - --operator-tenant={{ include "dsx-identity.operatorTenant" $ }}
            # SPIRE controller-manager derives its class from this release identity.
            - --class-name={{ $.Release.Namespace }}-{{ $.Release.Name }}
            {{- range $selector := required "identityController.dpuMetadataSelectors is required" $dpuMetadataSelectors }}
            - {{ printf "--dpu-metadata-selector=%s" $selector | quote }}
            {{- end }}
            - --log-level={{ .Values.observability.logLevel }}
            {{- if .Values.observability.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.observability.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
          # controller-runtime owns the controller metrics endpoint.
          env:
            {{- include "dsx-identity.observabilityEnv" (dict
                  "root" .
                  "serviceName" "dsx-identity-controller"
                  "metricsExporter" "none") | nindent 12 }}
          ports:
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
            {{- end }}
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
{{- if gt (int $values.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsx-identity.identityControllerLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsx-identity.identityControllerName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
