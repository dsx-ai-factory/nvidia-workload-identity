{{- if .Values.vmSupport.enabled }}
{{- $imageTag := .Values.global.imageTag | default .Chart.Version -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-dsx-imds-sidecars
  labels:
    {{- include "dsx-identity.labels" (dict "name" "vm-injection-policy" "root" .) | nindent 4 }}
spec:
  failurePolicy: Fail
  # Re-evaluate if another mutator changes the virt-launcher Pod later.
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      {{- toYaml .Values.vmSupport.policy.podSelector | nindent 6 }}
  matchConditions:
    - name: requests-dsx-imds
      expression: >-
        has(object.metadata.annotations) &&
        {{ .Values.vmSupport.policy.annotation | quote }} in object.metadata.annotations &&
        object.metadata.annotations[{{ .Values.vmSupport.policy.annotation | quote }}] == "true"
    - name: created-by-kubevirt-controller
      expression: >-
        request.userInfo.username ==
        {{ printf "system:serviceaccount:%s:%s" .Values.vmSupport.policy.serviceAccount.namespace .Values.vmSupport.policy.serviceAccount.name | quote }}
    - name: does-not-already-have-dsx-imds
      expression: >-
        !object.spec.containers.exists(container,
          container.name == "metadata-service" ||
          container.name == "dsx-imds-network-setup"
        )
  mutations:
    # ApplyConfiguration merges keyed volumes without replacing entries already
    # supplied by virt-launcher.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "spiffe-csi",
                  csi: Object.spec.volumes.csi{
                    driver: "csi.spiffe.io",
                    readOnly: true
                  }
                },
                Object.spec.volumes{
                  name: "identity-keys-csi",
                  csi: Object.spec.volumes.csi{
                    driver: "csi.dsx-identity-keys.nvidia.com",
                    readOnly: true
                  }
                }
              ]
            }
          }
    # imagePullSecrets is atomic, so JSONPatch preserves existing entries while
    # appending configured secrets. Typed container patches preserve exact order.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          {{- with .Values.imagePullSecrets }}
          [JSONPatch{
            op: "add",
            path: "/spec/imagePullSecrets",
            value: (has(object.spec.imagePullSecrets) ? object.spec.imagePullSecrets : []) +
              [
                {{- range $index, $secret := . }}{{ if $index }},{{ end }}
                Object.spec.imagePullSecrets{name: {{ $secret.name | quote }}}
                {{- end }}
              ].filter(secret,
                !has(object.spec.imagePullSecrets) ||
                !object.spec.imagePullSecrets.exists(existing, existing.name == secret.name)
              )
          }] +
          {{- end }}
          [
            JSONPatch{
              op: "add",
              path: "/spec/containers/-",
              value: Object.spec.containers{
                name: "dsx-imds-network-setup",
                image: {{ printf "%s:%s" .Values.vmSupport.imdsNetworkSetup.image.repository (.Values.vmSupport.imdsNetworkSetup.image.tag | default $imageTag) | quote }},
                imagePullPolicy: {{ .Values.vmSupport.imdsNetworkSetup.image.pullPolicy | quote }},
                command: ["/usr/local/bin/dsx-imds-network-setup"],
                args: [{{ printf "--log-level=%s" .Values.observability.logLevel | quote }}],
                env: {{ include "dsx-identity.observabilityEnv" (dict
                    "root" .
                    "serviceName" "dsx-imds-network-setup"
                    "metricsExporter" "none"
                    "objectType" "Object.spec.containers.env") | nindent 16 }},
                resources: Object.spec.containers.resources{
                  requests: {{ .Values.vmSupport.resources.networkSetup.requests | toJson }},
                  limits: {{ .Values.vmSupport.resources.networkSetup.limits | toJson }}
                },
                securityContext: Object.spec.containers.securityContext{
                  runAsUser: 0,
                  runAsGroup: 0,
                  runAsNonRoot: false,
                  allowPrivilegeEscalation: false,
                  capabilities: Object.spec.containers.securityContext.capabilities{
                    drop: ["ALL"],
                    add: ["NET_ADMIN"]
                  }
                }
              }
            },
            JSONPatch{
              op: "add",
              path: "/spec/containers/-",
              value: Object.spec.containers{
                name: "metadata-service",
                image: {{ printf "%s:%s" .Values.vmSupport.metadataService.image.repository (.Values.vmSupport.metadataService.image.tag | default $imageTag) | quote }},
                imagePullPolicy: {{ .Values.vmSupport.metadataService.image.pullPolicy | quote }},
                command: ["/usr/local/bin/metadata-service"],
                args: [
                  "--listen=:80",
                  {{ printf "--log-level=%s" .Values.observability.logLevel | quote }},
                  "--svid-hint=dsx-imds-vm",
                  "--identity-keys-url=unix:///run/dsx/identity-keys.sock"
                ],
                ports: [
                  Object.spec.containers.ports{
                    name: "http",
                    containerPort: 80
                  }
                ],
                env: {{ include "dsx-identity.observabilityEnv" (dict
                    "root" .
                    "serviceName" "metadata-service"
                    "metricsExporter" "none"
                    "objectType" "Object.spec.containers.env") | nindent 16 }},
                resources: Object.spec.containers.resources{
                  requests: {{ .Values.vmSupport.resources.metadata.requests | toJson }},
                  limits: {{ .Values.vmSupport.resources.metadata.limits | toJson }}
                },
                securityContext: Object.spec.containers.securityContext{
                  capabilities: Object.spec.containers.securityContext.capabilities{
                    drop: ["ALL"],
                    add: ["NET_BIND_SERVICE"]
                  },
                  allowPrivilegeEscalation: false,
                  readOnlyRootFilesystem: true,
                  runAsGroup: 1000,
                  runAsNonRoot: true,
                  runAsUser: 1000
                },
                volumeMounts: [
                  Object.spec.containers.volumeMounts{
                    name: "spiffe-csi",
                    mountPath: "/var/run/secrets/spire.io",
                    readOnly: true
                  },
                  Object.spec.containers.volumeMounts{
                    name: "identity-keys-csi",
                    mountPath: "/run/dsx",
                    readOnly: true
                  }
                ]
              }
            }
          ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: inject-dsx-imds-sidecars
  labels:
    {{- include "dsx-identity.labels" (dict "name" "vm-injection-policy" "root" .) | nindent 4 }}
spec:
  policyName: inject-dsx-imds-sidecars
  matchResources: {}
{{- end }}
