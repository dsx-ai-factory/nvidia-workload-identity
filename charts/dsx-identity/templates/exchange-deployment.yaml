{{- $trustDomain := required "global.spire.trustDomain is required" .Values.global.spire.trustDomain -}}
{{- $clusterName := required "global.spire.clusterName is required" .Values.global.spire.clusterName -}}
{{- if .Values.exchange.enabled }}
{{- $imageTag := .Values.exchange.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiffe-exchange
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "spiffe-exchange") | nindent 4 }}
spec:
  replicas: {{ .Values.exchange.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "spiffe-exchange") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsx-identity.labels" (dict "root" . "name" "spiffe-exchange") | nindent 8 }}
        {{- include "dsx-identity.dsxWorkloadLabel" . | nindent 8 }}
      {{- with (include "dsx-identity.observabilityPodAnnotations" (dict "root" . "containerNames" "spiffe-exchange")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: spiffe-exchange-sa
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.exchange.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exchange.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exchange.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spiffe-exchange
          image: "{{ .Values.exchange.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.exchange.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.exchange.service.port }}
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
            {{- end }}
          command:
            - /usr/local/bin/spiffe-exchange-service
          args:
            - --listen=:{{ .Values.exchange.service.port }}
            - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
            - --jwks-url={{ required "exchange.jwksURL is required" .Values.exchange.jwksURL }}
            - --signing-jwks=/run/secrets/spiffe-exchange/signing-jwks.json
            - --active-kid=/run/secrets/spiffe-exchange/active-kid
            - --shard-id={{ required "exchange.shardID is required" .Values.exchange.shardID }}
            - --mqtt-broker={{ required "exchange.mqtt.brokerURL is required" .Values.exchange.mqtt.brokerURL }}
            # Pod name keeps every active replica on a separate MQTT session.
            - --mqtt-client-id=spiffe-exchange-$(POD_NAME)
            - --public-key-lease-ttl={{ .Values.exchange.publicKeyLeaseTTL }}
            - --mqtt-oauth-token-url={{ required "exchange.mqtt.oauth2.tokenURL is required" .Values.exchange.mqtt.oauth2.tokenURL }}
            - --mqtt-oauth-client-id={{ required "exchange.mqtt.oauth2.clientID is required" .Values.exchange.mqtt.oauth2.clientID }}
            - --mqtt-oauth-client-secret=/run/secrets/spiffe-exchange-mqtt/client-secret
            - --log-level={{ .Values.observability.logLevel }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.exchange.resources | nindent 12 }}
          volumeMounts:
            - name: spiffe-csi
              mountPath: /var/run/secrets/spire.io
              readOnly: true
            - name: signing-keyset
              mountPath: /run/secrets/spiffe-exchange
              readOnly: true
            - name: mqtt-oauth
              mountPath: /run/secrets/spiffe-exchange-mqtt
              readOnly: true
          # Exchange owns its Pod ports, including the metrics listener.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "dsx-identity.observabilityEnv" (dict
                  "root" .
                  "serviceName" "spiffe-exchange"
                  "metricsExporter" (ternary "prometheus" "none" .Values.observability.metrics.enabled)) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /live
              port: {{ .Values.exchange.service.port }}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.exchange.service.port }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.exchange.service.port }}
            periodSeconds: 10
      volumes:
        - name: spiffe-csi
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: signing-keyset
          secret:
            secretName: {{ required "exchange.signingKeysetSecret is required" .Values.exchange.signingKeysetSecret }}
            defaultMode: 0440
        - name: mqtt-oauth
          secret:
            secretName: {{ required "exchange.mqtt.oauth2.clientSecretSecret is required" .Values.exchange.mqtt.oauth2.clientSecretSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.exchange.mqtt.oauth2.clientSecretKey }}
                path: client-secret
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spiffe-exchange
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "spiffe-exchange") | nindent 6 }}
{{- end }}
