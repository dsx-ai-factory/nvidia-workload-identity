{{- $trustDomain := required "global.spire.trustDomain is required" .Values.global.spire.trustDomain -}}
{{- $clusterName := required "global.spire.clusterName is required" .Values.global.spire.clusterName -}}
{{- if .Values.identityKeys.enabled }}
{{- $imageTag := .Values.identityKeys.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsx-identity-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "dsx-identity-keys") | nindent 4 }}
spec:
  replicas: {{ .Values.identityKeys.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "dsx-identity-keys") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsx-identity.labels" (dict "root" . "name" "dsx-identity-keys") | nindent 8 }}
        {{- include "dsx-identity.dsxWorkloadLabel" . | nindent 8 }}
      {{- with (include "dsx-identity.observabilityPodAnnotations" (dict "root" . "containerNames" "dsx-identity-keys")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: dsx-identity-keys-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "dsx-identity-keys") | nindent 14 }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.identityKeys.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identityKeys.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identityKeys.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dsx-identity-keys
          image: "{{ .Values.identityKeys.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.identityKeys.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.identityKeys.service.port }}
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
            {{- end }}
          command:
            - /usr/local/bin/dsx-identity-keys
          args:
            - --listen=:{{ .Values.identityKeys.service.port }}
            - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
            - --jwks-url={{ required "identityKeys.jwksURL is required" .Values.identityKeys.jwksURL }}
            - --signing-keyset=/run/secrets/dsx-identity-keys/keyset.json
            - --active-kid=/run/secrets/dsx-identity-keys-active-kid/active-kid.json
            - --shard-id={{ required "identityKeys.shardID is required" .Values.identityKeys.shardID }}
            - --mqtt-broker={{ required "identityKeys.mqtt.brokerURL is required" .Values.identityKeys.mqtt.brokerURL }}
            # Pod name keeps every active replica on a separate MQTT session.
            - --mqtt-client-id=dsx-identity-keys-$(POD_NAME)
            - --public-key-lease-ttl={{ .Values.identityKeys.publicKeyLeaseTTL }}
            - --mqtt-oauth-token-url={{ required "identityKeys.mqtt.oauth2.tokenURL is required" .Values.identityKeys.mqtt.oauth2.tokenURL }}
            - --mqtt-oauth-credentials-file=/run/secrets/dsx-identity-keys-mqtt/credentials.json
            - --log-level={{ .Values.observability.logLevel }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.identityKeys.resources | nindent 12 }}
          volumeMounts:
            - name: spiffe-csi
              mountPath: /var/run/secrets/spire.io
              readOnly: true
            - name: signing-keyset
              mountPath: /run/secrets/dsx-identity-keys
              readOnly: true
            - name: active-kid
              mountPath: /run/secrets/dsx-identity-keys-active-kid
              readOnly: true
            - name: mqtt-oauth
              mountPath: /run/secrets/dsx-identity-keys-mqtt
              readOnly: true
          # DSX Identity Keys owns its Pod ports, including the metrics listener.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "dsx-identity.observabilityEnv" (dict
                  "root" .
                  "serviceName" "dsx-identity-keys"
                  "metricsExporter" (ternary "prometheus" "none" .Values.observability.metrics.enabled)) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /live
              port: {{ .Values.identityKeys.service.port }}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.identityKeys.service.port }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.identityKeys.service.port }}
            periodSeconds: 10
      volumes:
        - name: spiffe-csi
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: signing-keyset
          secret:
            secretName: {{ required "identityKeys.signingKeysetSecret is required" .Values.identityKeys.signingKeysetSecret }}
            defaultMode: 0440
            items:
              - key: keyset.json
                path: keyset.json
        - name: active-kid
          secret:
            secretName: {{ required "identityKeys.activeKIDSecret is required" .Values.identityKeys.activeKIDSecret }}
            defaultMode: 0440
            items:
              - key: active-kid.json
                path: active-kid.json
        - name: mqtt-oauth
          secret:
            secretName: {{ required "identityKeys.mqtt.oauth2.credentialsSecret is required" .Values.identityKeys.mqtt.oauth2.credentialsSecret }}
            defaultMode: 0440
            items:
              - key: {{ required "identityKeys.mqtt.oauth2.credentialsKey is required" .Values.identityKeys.mqtt.oauth2.credentialsKey }}
                path: credentials.json
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dsx-identity-keys
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "dsx-identity-keys") | nindent 6 }}
{{- end }}
