{{- if and .Values.podTokenFetcher.enabled (not .Values.spire.enabled) }}
{{- fail "podTokenFetcher.enabled requires spire.enabled so selected Pods have a dsx-pod registration" }}
{{- end }}
{{- if .Values.podTokenFetcher.enabled }}
{{- $imageTag := .Values.podTokenFetcher.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-dsx-token-fetcher
  labels:
    {{- include "dsx-identity.labels" (dict "name" "pod-token-fetcher-policy" "root" .) | nindent 4 }}
spec:
  failurePolicy: Fail
  # Re-evaluate if an independent policy, such as Kata, changes the Pod later.
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: requests-dsx-token-fetcher
      expression: >-
        has(object.metadata.annotations) &&
        "spiffe.nvidia.com/inject-dsx-token-fetcher" in object.metadata.annotations &&
        object.metadata.annotations["spiffe.nvidia.com/inject-dsx-token-fetcher"] == "true"
    - name: does-not-already-have-token-fetcher
      expression: >-
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(container, container.name == "dsx-token-fetcher")
  mutations:
    # ApplyConfiguration merges map-like container mounts and volumes by their
    # Kubernetes merge keys. It mounts the token in every app container while
    # Kata may already own the spiffe-csi volume.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(container,
                Object.spec.containers{
                  name: container.name,
                  volumeMounts: [
                    Object.spec.containers.volumeMounts{
                      name: "dsx-token",
                      mountPath: "/run/secrets/nvidia.com/dsx",
                      readOnly: true
                    }
                  ]
                }
              ),
              volumes:
                (!has(object.spec.volumes) ||
                  !object.spec.volumes.exists(volume, volume.name == "spiffe-csi")
                  ? [Object.spec.volumes{
                    name: "spiffe-csi",
                    csi: Object.spec.volumes.csi{
                      driver: "csi.spiffe.io",
                      readOnly: true
                    }
                  }]
                  : []) + [Object.spec.volumes{
                name: "dsx-token",
                emptyDir: Object.spec.volumes.emptyDir{}
              }]
            }
          }
    # Create the atomic list when absent, then append only configured secrets
    # missing by name. Existing pull secrets and init-container order stay intact.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          {{- with .Values.imagePullSecrets }}
          (!has(object.spec.imagePullSecrets)
            ? [JSONPatch{
                op: "add",
                path: "/spec/imagePullSecrets",
                value: []
              }]
            : []) +
          [
            {{- range $index, $secret := . }}{{ if $index }},{{ end }}
            Object.spec.imagePullSecrets{name: {{ $secret.name | quote }}}
            {{- end }}
          ].filter(secret,
            !has(object.spec.imagePullSecrets) ||
            !object.spec.imagePullSecrets.exists(existing, existing.name == secret.name)
          ).map(secret, JSONPatch{
            op: "add",
            path: "/spec/imagePullSecrets/-",
            value: secret
          }) +
          {{- end }}
          (!has(object.spec.initContainers)
            ? [JSONPatch{
                op: "add",
                path: "/spec/initContainers",
                value: []
              }]
            : []) +
          [JSONPatch{
            op: "add",
            path: "/spec/initContainers/-",
            value: Object.spec.initContainers{
              name: "dsx-token-fetcher",
              image: {{ printf "%s:%s" .Values.podTokenFetcher.image.repository $imageTag | quote }},
              imagePullPolicy: {{ .Values.podTokenFetcher.image.pullPolicy | quote }},
              restartPolicy: "Always",
              command: ["/usr/local/bin/dsx-token-fetcher"],
              args: [
                "--socket=unix:///var/run/secrets/spire.io/spire-agent.sock",
                {{- /* Each workload names its relying party. A missing annotation fails admission under failurePolicy: Fail. */}}
                "--audience=" + object.metadata.annotations["spiffe.nvidia.com/token-audience"],
                {{- with .Values.podTokenFetcher.svidHint }}
                {{ printf "--svid-hint=%s" . | quote }},
                {{- end }}
                {{ printf "--output=%s" .Values.podTokenFetcher.outputPath | quote }},
                {{ printf "--identity-keys-url=%s" (required "podTokenFetcher.identityKeysURL is required" .Values.podTokenFetcher.identityKeysURL) | quote }},
                {{ printf "--log-level=%s" .Values.observability.logLevel | quote }}
              ],
              env: {{ include "dsx-identity.observabilityEnv" (dict
                  "root" .
                  "serviceName" "dsx-token-fetcher"
                  "metricsExporter" "none"
                  "objectType" "Object.spec.initContainers.env") | nindent 14 }},
              securityContext: Object.spec.initContainers.securityContext{
                allowPrivilegeEscalation: false,
                capabilities: Object.spec.initContainers.securityContext.capabilities{
                  drop: ["ALL"]
                },
                readOnlyRootFilesystem: true,
                runAsGroup: 0,
                runAsNonRoot: false,
                runAsUser: 0
              },
              {{- with .Values.podTokenFetcher.startupProbe }}
              startupProbe: Object.spec.initContainers.startupProbe{
                httpGet: Object.spec.initContainers.startupProbe.httpGet{
                  path: {{ .httpGet.path | quote }},
                  port: {{ .httpGet.port }}
                },
                periodSeconds: {{ .periodSeconds }},
                failureThreshold: {{ .failureThreshold }}
              },
              {{- end }}
              resources: Object.spec.initContainers.resources{
                requests: {{ .Values.podTokenFetcher.resources.requests | toJson }},
                limits: {{ .Values.podTokenFetcher.resources.limits | toJson }}
              },
              volumeMounts: [
                Object.spec.initContainers.volumeMounts{
                  name: "spiffe-csi",
                  mountPath: "/var/run/secrets/spire.io",
                  readOnly: true
                },
                Object.spec.initContainers.volumeMounts{
                  name: "dsx-token",
                  mountPath: "/run/secrets/nvidia.com/dsx"
                }
              ]
            }
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: inject-dsx-token-fetcher
  labels:
    {{- include "dsx-identity.labels" (dict "name" "pod-token-fetcher-policy" "root" .) | nindent 4 }}
spec:
  policyName: inject-dsx-token-fetcher
  # The Pod annotation is the explicit opt-in boundary.
  matchResources: {}
{{- end }}
