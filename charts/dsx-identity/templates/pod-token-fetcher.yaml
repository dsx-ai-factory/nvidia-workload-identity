{{- if and .Values.podTokenFetcher.enabled (not .Values.spire.enabled) }}
{{- fail "podTokenFetcher.enabled requires spire.enabled so selected Pods have a dsx-pod registration" }}
{{- end }}
{{- if .Values.podTokenFetcher.enabled }}
{{- $imageTag := .Values.podTokenFetcher.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-dsx-token-fetcher
  labels:
    {{- include "dsx-identity.labels" (dict "name" "pod-token-fetcher-policy" "root" .) | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    policies.kyverno.io/title: Inject DSX Token Fetcher
    policies.kyverno.io/category: SPIFFE
spec:
  background: false
  rules:
    - name: add-token-fetcher
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
              selector:
                matchLabels:
                  spiffe.nvidia.com/service: dsx
              namespaceSelector:
                {{- toYaml .Values.podTokenFetcher.policy.namespaceLabelSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            # Only the exchanged token is shared with application containers.
            containers:
              - (name): "*"
                volumeMounts:
                  - name: dsx-token
                    mountPath: /run/secrets/nvidia.com/dsx
                    readOnly: true
            # Native sidecar: start before app containers and keep refreshing the token.
            initContainers:
              - name: dsx-token-fetcher
                image: "{{ .Values.podTokenFetcher.image.repository }}:{{ $imageTag }}"
                imagePullPolicy: {{ .Values.podTokenFetcher.image.pullPolicy }}
                restartPolicy: Always
                command:
                  - /usr/local/bin/dsx-token-fetcher
                args:
                  - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
                  - --audience={{ .Values.podTokenFetcher.audience }}
                  - --svid-hint=dsx-pod
                  - --output={{ .Values.podTokenFetcher.outputPath }}
                  - --identity-keys-url={{ required "podTokenFetcher.identityKeysURL is required" .Values.podTokenFetcher.identityKeysURL }}
                  - --log-level={{ .Values.observability.logLevel }}
                # The consumer owns Pod annotations and the shared network namespace.
                env:
                  {{- include "dsx-identity.observabilityEnv" (dict
                        "root" .
                        "serviceName" "dsx-token-fetcher"
                        "metricsExporter" "none") | nindent 18 }}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                  readOnlyRootFilesystem: true
                  runAsGroup: 0
                  runAsNonRoot: false
                  runAsUser: 0
                {{- with .Values.podTokenFetcher.startupProbe }}
                startupProbe:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                resources:
                  {{- toYaml .Values.podTokenFetcher.resources | nindent 18 }}
                volumeMounts:
                  - name: spiffe-csi
                    mountPath: /var/run/secrets/spire.io
                    readOnly: true
                  - name: dsx-token
                    mountPath: /run/secrets/nvidia.com/dsx
            volumes:
              - name: spiffe-csi
                csi:
                  driver: csi.spiffe.io
                  readOnly: true
              - name: dsx-token
                emptyDir: {}
    {{- if .Values.kataSupport.enabled }}
    # When Kata is enabled, tweak the token fetcher flow. In particular,
    # replace the SPIFFE CSI bind mount with the kata-uds-proxy sidecar.
    - name: add-kata-guest-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  spiffe.nvidia.com/service: dsx
              namespaceSelector:
                {{- toYaml .Values.podTokenFetcher.policy.namespaceLabelSelector | nindent 16 }}
      preconditions:
        all:
          - key: "{{ `{{ request.object.spec.runtimeClassName || '' }}` }}"
            operator: AnyIn
            value:
              {{- toYaml .Values.kataSupport.runtimeClassNames | nindent 14 }}
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              # The token fetcher retries the Workload API every
              # second, so it tolerates this socket appearing after it starts.
              - name: dsx-kata-guest-proxy
                image: "{{ .Values.kataSupport.image.repository }}:{{ .Values.kataSupport.image.tag | default .Values.global.imageTag | default .Chart.Version }}"
                imagePullPolicy: {{ .Values.kataSupport.image.pullPolicy }}
                restartPolicy: Always
                command:
                  - /usr/local/bin/guest-entrypoint.sh
                env:
                  - name: SOCK_PATH
                    value: /var/run/secrets/spire.io/spire-agent.sock
                  - name: VSOCK_PORT
                    value: {{ .Values.kataSupport.vsockPort | quote }}
                # MKNOD creates /dev/vsock, which a Kata guest exposes in sysfs
                # but leaves out of the container image. Both writes target tmpfs
                # and the shared volume, so the root filesystem stays read-only.
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                    add: ["MKNOD"]
                  readOnlyRootFilesystem: true
                  runAsGroup: 0
                  runAsNonRoot: false
                  runAsUser: 0
                resources:
                  {{- toYaml .Values.kataSupport.resources.guestProxy | nindent 18 }}
                volumeMounts:
                  # Read-write, unlike the token fetcher: this container creates
                  # the socket that the fetcher then dials.
                  - name: kata-workload-api
                    mountPath: /var/run/secrets/spire.io
              # volumeMounts merges on mountPath, so naming the same path here
              # repoints the existing mount at the emptyDir below.
              - name: dsx-token-fetcher
                volumeMounts:
                  - name: kata-workload-api
                    mountPath: /var/run/secrets/spire.io
                    readOnly: true
            volumes:
              # Rather than SPIFFE CSI, which won't work with Kata (the host unix socket
              # isn't accessible), use an emptyDir shared with the proxy sidecar.
              - name: spiffe-csi
                $patch: delete
              - name: kata-workload-api
                emptyDir:
                  medium: Memory
                  sizeLimit: 1Mi
    {{- end }}
    - name: validate-operator-pod-role
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  spiffe.nvidia.com/service: dsx
              namespaceSelector:
                {{- toYaml .Values.podTokenFetcher.policy.namespaceLabelSelector | nindent 16 }}
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !('spiffe.nvidia.com/role' in object.metadata.labels) ||
                object.metadata.labels['spiffe.nvidia.com/role'].matches('^[a-z0-9][a-z0-9_-]{0,62}$')
              message: The optional operator Pod role must be one valid DSX role path segment.
{{- end }}
