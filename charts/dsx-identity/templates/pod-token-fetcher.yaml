{{- if and .Values.podTokenFetcher.enabled (not .Values.spire.enabled) }}
{{- fail "podTokenFetcher.enabled requires spire.enabled so selected Pods have a dsx-pod registration" }}
{{- end }}
{{- if .Values.podTokenFetcher.enabled }}
{{- $imageTag := .Values.podTokenFetcher.image.tag | default .Values.global.imageTag | default .Chart.Version -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-dsx-token-fetcher
  labels:
    {{- include "dsx-identity.labels" (dict "name" "pod-token-fetcher-policy" "root" .) | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    policies.kyverno.io/title: Inject DSX Token Fetcher
    policies.kyverno.io/category: SPIFFE
spec:
  background: false
  rules:
    - name: add-token-fetcher
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  spiffe.nvidia.com/service: dsx
              namespaceSelector:
                {{- toYaml .Values.podTokenFetcher.policy.namespaceLabelSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            # Only the exchanged token is shared with application containers.
            containers:
              - (name): "*"
                volumeMounts:
                  - name: dsx-token
                    mountPath: /run/secrets/nvidia.com/dsx
                    readOnly: true
            # Native sidecar: start before app containers and keep refreshing the token.
            initContainers:
              - name: dsx-token-fetcher
                image: "{{ .Values.podTokenFetcher.image.repository }}:{{ $imageTag }}"
                imagePullPolicy: {{ .Values.podTokenFetcher.image.pullPolicy }}
                restartPolicy: Always
                command:
                  - /usr/local/bin/dsx-token-fetcher
                args:
                  - --socket=unix:///var/run/secrets/spire.io/spire-agent.sock
                  - --audience={{ .Values.podTokenFetcher.audience }}
                  - --svid-hint=dsx-pod
                  - --output={{ .Values.podTokenFetcher.outputPath }}
                  - --identity-keys-url={{ required "podTokenFetcher.identityKeysURL is required" .Values.podTokenFetcher.identityKeysURL }}
                  - --log-level={{ .Values.observability.logLevel }}
                # The consumer owns Pod annotations and the shared network namespace.
                env:
                  {{- include "dsx-identity.observabilityEnv" (dict
                        "root" .
                        "serviceName" "dsx-token-fetcher"
                        "metricsExporter" "none") | nindent 18 }}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                  readOnlyRootFilesystem: true
                  runAsGroup: 0
                  runAsNonRoot: false
                  runAsUser: 0
                {{- with .Values.podTokenFetcher.startupProbe }}
                startupProbe:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                resources:
                  {{- toYaml .Values.podTokenFetcher.resources | nindent 18 }}
                volumeMounts:
                  - name: spiffe-csi
                    mountPath: /var/run/secrets/spire.io
                    readOnly: true
                  - name: dsx-token
                    mountPath: /run/secrets/nvidia.com/dsx
            volumes:
              - name: spiffe-csi
                csi:
                  driver: csi.spiffe.io
                  readOnly: true
              - name: dsx-token
                emptyDir: {}
    - name: validate-operator-pod-role
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  spiffe.nvidia.com/service: dsx
              namespaceSelector:
                {{- toYaml .Values.podTokenFetcher.policy.namespaceLabelSelector | nindent 16 }}
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !('spiffe.nvidia.com/role' in object.metadata.labels) ||
                object.metadata.labels['spiffe.nvidia.com/role'].matches('^[a-z0-9][a-z0-9_-]{0,62}$')
              message: The optional operator Pod role must be one valid DSX role path segment.
{{- end }}
