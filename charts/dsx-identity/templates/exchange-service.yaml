{{- if .Values.exchange.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: spiffe-exchange
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "spiffe-exchange") | nindent 4 }}
spec:
  selector:
    {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "spiffe-exchange") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.exchange.service.port }}
      targetPort: http
      {{- with .Values.exchange.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- if .Values.observability.metrics.enabled }}
    - name: metrics
      port: {{ .Values.observability.metrics.port }}
      targetPort: metrics
    {{- end }}
  type: {{ .Values.exchange.service.type }}
{{- end }}
