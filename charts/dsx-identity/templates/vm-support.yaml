{{- if .Values.vmSupport.enabled }}
{{- $imageTag := .Values.global.imageTag | default .Chart.Version -}}
{{- $identityKeysTarget := required "vmSupport.identityKeysProxy.target is required" .Values.vmSupport.identityKeysProxy.target -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsx-identity-keys-proxy-csi
  namespace: {{ .Release.Namespace }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dsx-identity-keys-proxy-csi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "dsx-identity-keys-proxy-csi") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "dsx-identity.selectorLabels" (dict "root" . "name" "dsx-identity-keys-proxy-csi") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsx-identity.labels" (dict "root" . "name" "dsx-identity-keys-proxy-csi") | nindent 8 }}
        spiffe.nvidia.com/service: {{ include "dsx-identity.defaultServiceName" . | quote }}
      {{- with (include "dsx-identity.observabilityPodAnnotations" (dict "root" . "containerNames" "dsx-identity-keys-proxy-csi")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: dsx-identity-keys-proxy-csi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.vmSupport.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: identity-keys-proxy
          image: "{{ .Values.vmSupport.socat.image.repository }}:{{ .Values.vmSupport.socat.image.tag }}"
          imagePullPolicy: {{ .Values.vmSupport.socat.image.pullPolicy }}
          args:
            # CSI consumers share no supplemental group, so any container UID must connect.
            - UNIX-LISTEN:/run/dsx/identity-keys.sock,fork,mode=0777
            - {{ $identityKeysTarget | quote }}
          resources:
            {{- toYaml .Values.vmSupport.resources.identityKeysProxy | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: identity-keys-socket-dir
              mountPath: /run/dsx
        - name: dsx-identity-keys-proxy-csi
          image: "{{ .Values.vmSupport.identityKeysProxyCsi.image.repository }}:{{ .Values.vmSupport.identityKeysProxyCsi.image.tag | default $imageTag }}"
          imagePullPolicy: {{ .Values.vmSupport.identityKeysProxyCsi.image.pullPolicy }}
          command:
            - /usr/local/bin/dsx-identity-keys-proxy-csi
          args:
            - --node-id=$(MY_NODE_NAME)
            - --socket-dir=/run/dsx
            - --csi-socket-path=/dsx-identity-keys-proxy-csi/csi.sock
            - --log-level={{ .Values.observability.logLevel }}
          {{- if .Values.observability.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
          {{- end }}
          # This standalone DaemonSet owns its metrics listener.
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- include "dsx-identity.observabilityEnv" (dict
                  "root" .
                  "serviceName" "dsx-identity-keys-proxy-csi"
                  "metricsExporter" (ternary "prometheus" "none" .Values.observability.metrics.enabled)) | nindent 12 }}
          # NodePublishVolume requires bind mounts into kubelet's pod tree.
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.vmSupport.resources.driver | nindent 12 }}
          volumeMounts:
            - name: identity-keys-socket-dir
              mountPath: /run/dsx
              readOnly: true
            - name: csi-socket-dir
              mountPath: /dsx-identity-keys-proxy-csi
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: "{{ .Values.vmSupport.nodeDriverRegistrar.image.repository }}:{{ .Values.vmSupport.nodeDriverRegistrar.image.tag }}"
          imagePullPolicy: {{ .Values.vmSupport.nodeDriverRegistrar.image.pullPolicy }}
          args:
            - --csi-address=/dsx-identity-keys-proxy-csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.dsx-identity-keys.nvidia.com/csi.sock
          resources:
            {{- toYaml .Values.vmSupport.resources.registrar | nindent 12 }}
          # Kubelet owns the driver socket and registration directories as root.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /dsx-identity-keys-proxy-csi
            - name: kubelet-plugin-registration-dir
              mountPath: /registration
      volumes:
        - name: identity-keys-socket-dir
          # Published bind mounts must survive a CSI DaemonSet rollout.
          hostPath:
            path: /var/lib/kubelet/plugins/csi.dsx-identity-keys.nvidia.com/proxy
            type: DirectoryOrCreate
        - name: csi-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.dsx-identity-keys.nvidia.com
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: kubelet-plugin-registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.dsx-identity-keys.nvidia.com
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral
{{- end }}
