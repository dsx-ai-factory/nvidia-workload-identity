{{- if .Values.dpuService.imds.enabled }}
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: dsx-imds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-identity.labels" (dict "root" . "name" "dsx-imds") | nindent 4 }}
spec:
  security:
    privileged: false
  helmChart:
    source:
      repoURL: {{ .Values.dpuService.imds.helmChart.repoURL }}
      chart: dsx-imds
      version: {{ .Values.dpuService.imds.helmChart.version | default .Chart.Version | quote }}
      releaseName: dsx-imds
    values:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      workload:
        {{- toYaml .Values.dpuService.workload | nindent 8 }}
      metadataService:
        image:
          {{- toYaml .Values.dpuService.imds.image | nindent 10 }}
        identityKeysURL: {{ required "dpuService.identityKeysURL is required" .Values.dpuService.identityKeysURL | quote }}
        {{- with .Values.dpuService.imds.spireSocketPath }}
        spireSocketPath: {{ . | quote }}
        {{- end }}
        logLevel: {{ .Values.observability.logLevel }}
        env:
          {{- toYaml .Values.dpuService.observabilityEnv | nindent 10 }}
{{- end }}
