# DSX identity chart. Override the trust domain and cluster name per shard.
global:
  imageTag: ""
  # Tenant for operator DPUs, Kubernetes Pods, and bare-metal worker hosts.
  operatorTenant: ""
  spire:
    trustDomain: ""
    clusterName: ""
    jwtIssuer: ""

spire:
  enabled: true
  spire-server:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    defaultJwtSvidTTL: 5m
    # Configure the dsx_imds server plugin with the official SPIRE chart's
    # initContainers, volumes, and customPlugins values. See the values example
    # in the README for the complete external-plugin contract.
    # External plugin subprocesses inherit the documented DSX OTel injection
    # from the SPIRE server container.
    podAnnotations:
      instrumentation.opentelemetry.io/inject-sdk: dsx-obs/default-instrumentation
      instrumentation.opentelemetry.io/container-names: spire-server
      sidecar.opentelemetry.io/inject: dsx-obs/default-sidecar
    controllerManager:
      expandEnv: true
      # The official SPIRE chart owns this Pod field. Set it to the same value
      # as global.operatorTenant. DSX templates reject a mismatch.
      extraEnv:
        - name: OPERATOR_TENANT
          value: ""
      parentIDTemplate: 'spiffe://{{ .TrustDomain }}/spire/agent/dsx_imds/tenant/$OPERATOR_TENANT/host/{{ .NodeMeta.Name }}'
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      reconcile:
        # DSX shards exchange tokens and public keys. SPIRE is not federated.
        clusterFederatedTrustDomains: false
      identities:
        clusterSPIFFEIDs:
          # The upstream chart enables sample identities by default.
          default:
            enabled: false
          oidc-discovery-provider:
            enabled: false
          test-keys:
            enabled: false
          spike-keeper:
            enabled: false
          spike-nexus:
            enabled: false
          spike-pilot:
            enabled: false
  # Every worker uses its externally provisioned dsx_imds host agent.
  spire-agent:
    enabled: false
  spiffe-oidc-discovery-provider:
    enabled: false
  spiffe-csi-driver:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

admission:
  enabled: true
  # Subjects that deploy chart-owned SPIRE registration resources.
  deploymentSubjects: []
  # - kind: Group
  #   name: identity-deployers
  # - kind: ServiceAccount
  #   name: identity-deployer
  #   namespace: identity-system

observability:
  # One level configures every chart-owned first-party Go process.
  logLevel: info
  # Standard OTel environment settings shared by first-party applications.
  # The DSX Operator injection supplies its resource and endpoint settings.
  env: {}
  # Additional annotations are merged with SDK injection annotations.
  podAnnotations: {}
  metrics:
    # Configures the Prometheus endpoints owned by chart workloads. Injected
    # processes do not open listeners in consumer-owned Pod network namespaces.
    enabled: true
    port: 9464
    serviceMonitor:
      # The Prometheus Operator and its CRDs are external to this chart.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

identityKeys:
  enabled: true
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-identity-keys
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  jwksURL: ""
  # Must match the Event Bus retained-message maxAge and cover DSX JWT validity.
  publicKeyLeaseTTL: 10m
  # Globally unique across every DSX Identity Keys instance sharing this Event Bus fabric.
  shardID: ""
  signingKeysetSecret: dsx-identity-keys-signing-keyset
  mqtt:
    brokerURL: ""
    oauth2:
      tokenURL: ""
      clientID: dsx-identity-keys
      clientSecretSecret: dsx-identity-keys-mqtt-oauth
      clientSecretKey: client-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

podTokenFetcher:
  enabled: true
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-token-fetcher
    tag: ""
    pullPolicy: IfNotPresent
  audience: spiffe://ds9.dsx.nvid.id/openbao
  identityKeysURL: ""
  outputPath: /run/secrets/nvidia.com/dsx/token
  startupProbe:
    httpGet:
      path: /healthz
      port: 8080
    periodSeconds: 1
    failureThreshold: 30
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  policy:
    namespaceLabelSelector:
      matchLabels:
        spiffe.nvidia.com/enabled: "true"

vmSupport:
  enabled: false
  identityKeysProxyNamespace: dsx-identity-keys-proxy-system
  tolerations: []
  identityKeysProxy:
    target: ""
  socat:
    image:
      repository: alpine/socat
      tag: 1.8.0.3
      pullPolicy: IfNotPresent
  nodeDriverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.12.0
      pullPolicy: IfNotPresent
  metadataService:
    image:
      repository: nvcr.io/0837451325059433/components-dev/metadata-service
      tag: ""
      pullPolicy: IfNotPresent
  imdsNetworkSetup:
    image:
      repository: nvcr.io/0837451325059433/components-dev/dsx-imds-network-setup
      tag: ""
      pullPolicy: IfNotPresent
  identityKeysProxyCsi:
    image:
      repository: nvcr.io/0837451325059433/components-dev/dsx-identity-keys-proxy-csi
      tag: ""
      pullPolicy: IfNotPresent
  resources:
    identityKeysProxy:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    driver:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 50m, memory: 64Mi}
    registrar:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    metadata:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    networkSetup:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  policy:
    annotation: spiffe.nvidia.com/inject-dsx-imds
    namespaceSelector:
      matchLabels:
        spiffe.nvidia.com/vm-metadata-enabled: "true"
    podSelector:
      matchLabels:
        kubevirt.io: virt-launcher
    serviceAccount:
      name: kubevirt-controller
      namespace: kubevirt
identityController:
  enabled: false
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-identity-controller
    tag: ""
    pullPolicy: IfNotPresent
  # These selectors identify the token fetcher that calls each DPU Workload API.
  dpuTokenFetcherSelectors: []
  # These selectors identify DPU-side metadata-service for host identities.
  dpuMetadataSelectors: []
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
