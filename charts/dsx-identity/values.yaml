# NVIDIA Workload Identity chart.
# Override the trust domain and cluster name per shard.
global:
  imageTag: ""
  dsx:
    # HTTPS issuer placed in exchanged DSX JWTs and accepted for host attestation.
    jwtIssuer: ""
    # Deployment coordinates encoded in exchanged DSX JWT trust domains.
    region: ""
    partition: ""
    # Default service name for chart-owned and controller-managed identities.
    defaultServiceName: dsx
  # Tenant for operator DPUs, Kubernetes Pods, and bare-metal worker hosts.
  operatorTenant: ""
  spire:
    trustDomain: ""
    clusterName: ""
    jwtIssuer: ""

# Registry credentials for chart-owned and injected DSX images. Each matched
# consumer namespace must contain Secrets with these names.
imagePullSecrets: []

spire:
  enabled: true
  spire-server:
    enabled: true
    # This image extends the pinned upstream SPIRE server image with both DSX
    # server plugins. Keep its tag aligned with the NVIDIA Workload Identity
    # chart version.
    image:
      registry: nvcr.io
      repository: 0837451325059433/components-dev/dsx-spire-server
      pullPolicy: IfNotPresent
      tag: 0.1.0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    defaultJwtSvidTTL: 5m
    # Configure the embedded plugins with the official SPIRE chart's
    # customPlugins values. See the values example in the README for the
    # complete external-plugin contract.
    # External plugin subprocesses inherit the documented DSX OTel injection
    # from the SPIRE server container.
    podAnnotations:
      instrumentation.opentelemetry.io/inject-sdk: dsx-obs/default-instrumentation
      instrumentation.opentelemetry.io/container-names: spire-server
      sidecar.opentelemetry.io/inject: dsx-obs/default-sidecar
    # SPIRE provides native Prometheus metrics but no tracing support.
    telemetry:
      prometheus:
        enabled: true
    controllerManager:
      expandEnv: true
      # The official SPIRE chart owns this Pod field. Set it to the same value
      # as global.operatorTenant. DSX templates reject a mismatch.
      extraEnv:
        - name: OPERATOR_TENANT
          value: ""
      parentIDTemplate: 'spiffe://{{ .TrustDomain }}/spire/agent/dsx_imds/tenant/$OPERATOR_TENANT/bm/{{ .NodeMeta.Name }}'
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      reconcile:
        # DSX shards exchange tokens and public keys. SPIRE is not federated.
        clusterFederatedTrustDomains: false
      identities:
        clusterSPIFFEIDs:
          # The upstream chart enables sample identities by default.
          default:
            enabled: false
          oidc-discovery-provider:
            enabled: false
          test-keys:
            enabled: false
          spike-keeper:
            enabled: false
          spike-nexus:
            enabled: false
          spike-pilot:
            enabled: false
  # Every worker uses its externally provisioned dsx_imds host agent.
  spire-agent:
    enabled: false
    # Local fixtures that enable the bundled agent retain SPIRE's native
    # Prometheus producer. Production host and DPU agents are external.
    telemetry:
      prometheus:
        enabled: true
  spiffe-oidc-discovery-provider:
    enabled: false
  spiffe-csi-driver:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

observability:
  # One level configures every chart-owned first-party Go process.
  logLevel: info
  # Standard OTel environment settings shared by first-party applications.
  # IPv4 loopback avoids the unsupported IPv6 localhost resolved by the SDK.
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_LOGS_EXPORTER: none
    OTEL_TRACES_EXPORTER: otlp
  # Additional annotations are merged with SDK injection annotations.
  podAnnotations: {}
  metrics:
    # Configures the Prometheus endpoints owned by chart workloads. Injected
    # processes do not open listeners in consumer-owned Pod network namespaces.
    enabled: true
    port: 9464
    serviceMonitor:
      # The Prometheus Operator and its CRDs are external to this chart.
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

identityKeys:
  enabled: true
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-identity-keys
    tag: ""
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations: []
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  jwksURL: ""
  # Covers DSX JWT validity. Instances refresh each KV entry four times per TTL.
  publicKeyTTL: 10m
  # Polling covers file changes missed by filesystem notifications.
  fileWatchPollInterval: 30s
  # Globally unique across every NVIDIA Workload Identity Keys instance sharing
  # this NATS KV bucket.
  shardID: ""
  # Existing Opaque Secret. keyset.json must contain
  # {"keys":["<PEM-encoded asymmetric private key>", ...]}.
  signingKeysetSecret: dsx-identity-keys-signing-keyset
  # Existing Opaque Secret. active-kid.json must contain
  # {"active_kid":"<RFC 7638 public JWK thumbprint>","alg":"<JOSE algorithm>"}.
  activeKIDSecret: dsx-identity-keys-active-kid
  # Existing Secret or ConfigMap volumes and mounts for the Identity Keys process.
  extraVolumes: []
  extraVolumeMounts: []
  nats:
    enabled: true
    serverURL: ""
    kv:
      bucket: DSX_IDENTITY_KEYS
      replicas: 1
    auth:
      # Supported modes: none, oauth2.
      mode: none
      # Existing Opaque Secret. The selected data key must contain
      # {"client_id":"<non-empty>","client_secret":"<non-empty>"}.
      credentialsSecret: ""
      # Secret data key mounted as credentials.json.
      credentialsKey: credentials.json
      issuerURL: ""
      scopes: [nats]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

podTokenFetcher:
  enabled: true
  # Must match the host ClusterSPIFFEID registration hint.
  svidHint: dsx-pod
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-token-fetcher
    tag: ""
    pullPolicy: IfNotPresent
  identityKeysURL: ""
  outputPath: /run/secrets/nvidia.com/dsx/token
  startupProbe:
    httpGet:
      path: /healthz
      port: 8080
    periodSeconds: 1
    failureThreshold: 30
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
vmSupport:
  enabled: false
  tolerations: []
  identityKeysProxy:
    target: ""
    # Set when the Unix proxy reaches an HTTP virtual host through TLS.
    httpHost: ""
  socat:
    image:
      repository: alpine/socat
      tag: 1.8.1.3
      pullPolicy: IfNotPresent
  nodeDriverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      pullPolicy: IfNotPresent
  metadataService:
    image:
      repository: nvcr.io/0837451325059433/components-dev/metadata-service
      tag: ""
      pullPolicy: IfNotPresent
  imdsNetworkSetup:
    image:
      repository: nvcr.io/0837451325059433/components-dev/dsx-imds-network-setup
      tag: ""
      pullPolicy: IfNotPresent
  identityKeysProxyCsi:
    image:
      repository: nvcr.io/0837451325059433/components-dev/dsx-identity-keys-proxy-csi
      tag: ""
      pullPolicy: IfNotPresent
  resources:
    identityKeysProxy:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    driver:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 50m, memory: 64Mi}
    registrar:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    # Injected sidecars need equal requests and limits to preserve Guaranteed
    # QoS, which KubeVirt requires for VMs with dedicated CPU placement.
    metadata:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 50m, memory: 64Mi}
    networkSetup:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 10m, memory: 32Mi}
  policy:
    annotation: spiffe.nvidia.com/inject-dsx-imds
    podSelector:
      matchLabels:
        kubevirt.io: virt-launcher
    serviceAccount:
      name: kubevirt-controller
      namespace: kubevirt

# DPF deploys this service into each selected DPU cluster.
dpuService:
  tokenFetcher:
    # Install native token-fetcher admission in selected DPU clusters.
    enabled: false
    # Must match DPF's per-DPUService ClusterStaticEntry registration hint.
    svidHint: dpu-service
    # DPF provides this cluster-scoped CSI driver to DPU workloads.
    spiffeCsiDriver: csi.spiffe.io
    # DPF's CSI mount preserves the DPU agent socket filename.
    spireSocketPath: /var/run/secrets/spire.io/agent.sock
    helmChart:
      repoURL: https://helm.ngc.nvidia.com/0837451325059433/components-dev/
      version: ""
  imds:
    enabled: true
    helmChart:
      repoURL: https://helm.ngc.nvidia.com/0837451325059433/components-dev/
      version: ""
    image:
      repository: nvcr.io/0837451325059433/components-dev/metadata-service
      tag: ""
      pullPolicy: IfNotPresent
  # Defaults used by both the child chart and the controller's DPU entry.
  workload:
    serviceAccountName: dsx-imds
    containerName: metadata-service
  # DPU clusters cannot resolve the management cluster's Kubernetes Services.
  identityKeysURL: ""
  # Set the DPU collector endpoint here. The management-cluster sidecar endpoint
  # under observability.env is not reachable from DPU Pods.
  observabilityEnv: {}

# Kata Containers support. A Kata Pod runs inside a VM, so the SPIFFE CSI driver
# cannot carry the Workload API socket across the VM boundary. The host proxy
# serves that socket over vsock and the guest proxy re-serves it as a unix socket
# at the standard SPIRE Workload API path inside each selected Kata Pod.
kataSupport:
  enabled: false
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-kata-uds-proxy
    tag: ""
    pullPolicy: IfNotPresent
  # Pods with one of these runtime classes receive the guest proxy in place of
  # the SPIFFE CSI volume, independently of token-fetcher injection.
  runtimeClassNames:
    - kata-qemu-nvidia-cpu-runtime-rs
    - kata-qemu-runtime-rs
    - kata-qemu
  # Both halves of the proxy must agree on this vsock port.
  vsockPort: 3978
  # The Kata operator labels every node that provides a Kata runtime. The host
  # proxy also requires cgroup v2, the systemd cgroup driver, and Kata configured
  # with sandbox_cgroup_only=true.
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  tolerations: []
  resources:
    hostProxy:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    guestProxy:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 50m, memory: 128Mi}
identityController:
  enabled: false
  sourceAPIPollInterval: 1h
  image:
    repository: nvcr.io/0837451325059433/components-dev/dsx-identity-controller
    tag: ""
    pullPolicy: IfNotPresent
  # Replaces the selectors derived from dpuService.workload when non-empty.
  dpuMetadataSelectors: []
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
