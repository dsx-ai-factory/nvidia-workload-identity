# Adapted from https://github.com/spiffe/helm-charts-hardened/blob/aabc73b1e51976d6115fa1291b71889010ee64f9/charts/spire/charts/spiffe-csi-driver/templates/spiffe-csi-driver.yaml
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ required "pluginName is required" .Values.pluginName }}
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral
---
# Adapted from https://github.com/spiffe/helm-charts-hardened/blob/aabc73b1e51976d6115fa1291b71889010ee64f9/charts/spire/charts/spiffe-csi-driver/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-spiffe-csi.labels" . | nindent 4 }}
    {{- with .Values.serviceDaemonSet.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceDaemonSet.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.serviceDaemonSet.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dsx-spiffe-csi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsx-spiffe-csi.labels" . | nindent 8 }}
        {{- with .Values.serviceDaemonSet.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.serviceDaemonSet.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.serviceDaemonSet.nodeSelector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml . | nindent 12 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spiffe-csi-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -workload-api-socket-dir
            - /spire-agent-socket
            - -plugin-name
            - {{ .Values.pluginName }}
            - -csi-socket-path
            - /spiffe-csi/csi.sock
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- include "dsx-spiffe-csi.resources" (dict
                  "serviceDaemonSet" .Values.serviceDaemonSet.resources
                  "defaults" .Values.resources.driver) | nindent 12 }}
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: spire-agent-socket-dir
              mountPath: /spire-agent-socket
              readOnly: true
            - name: spiffe-csi-socket-dir
              mountPath: /spiffe-csi
            - name: mountpoint-dir
              mountPath: {{ .Values.kubeletPath }}/pods
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: "{{ .Values.nodeDriverRegistrar.image.repository }}:{{ .Values.nodeDriverRegistrar.image.tag }}"
          imagePullPolicy: {{ .Values.nodeDriverRegistrar.image.pullPolicy }}
          args:
            - -csi-address
            - /spiffe-csi/csi.sock
            - -kubelet-registration-path
            - {{ .Values.kubeletPath }}/plugins/{{ .Values.pluginName }}/csi.sock
            - -health-port
            - "9809"
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            {{- include "dsx-spiffe-csi.resources" (dict
                  "serviceDaemonSet" .Values.serviceDaemonSet.resources
                  "defaults" .Values.resources.registrar) | nindent 12 }}
          securityContext:
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: spiffe-csi-socket-dir
              mountPath: /spiffe-csi
            - name: kubelet-plugin-registration-dir
              mountPath: /registration
      volumes:
        - name: spire-agent-socket-dir
          hostPath:
            path: {{ dir .Values.agentSocketPath }}
            type: DirectoryOrCreate
        - name: spiffe-csi-socket-dir
          hostPath:
            path: {{ .Values.kubeletPath }}/plugins/{{ .Values.pluginName }}
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: {{ .Values.kubeletPath }}/pods
            type: Directory
        - name: kubelet-plugin-registration-dir
          hostPath:
            path: {{ .Values.kubeletPath }}/plugins_registry
            type: Directory
