# DPF injects scheduling and ownership metadata for this DPUService.
serviceDaemonSet:
  nodeSelector: {}
  labels: {}
  annotations: {}
  updateStrategy: {}
  resources: {}

imagePullSecrets: []

# Defaults copied from the DPF SPIFFE CSI integration and its pinned source.
pluginName: csi.spiffe.io
agentSocketPath: /run/spire/agent.sock
kubeletPath: /var/lib/kubelet
image:
  repository: ghcr.io/spiffe/spiffe-csi-driver
  tag: 0.2.7@sha256:9dfe4f0caff096164fd921aa7f15319804df2fc0325f1d90bc793ef3256ab1cd
  pullPolicy: IfNotPresent
nodeDriverRegistrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.9.4@sha256:ab6c4603d8da43d9f33361a5716552080e3f72badfad099d76fcf4b59e547d80
    pullPolicy: IfNotPresent
resources:
  driver:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
  registrar:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 50m, memory: 32Mi}
