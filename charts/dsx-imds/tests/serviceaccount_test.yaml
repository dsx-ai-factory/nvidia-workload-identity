suite: DSX IMDS ServiceAccount
templates:
  - templates/serviceaccounts.yaml
tests:
  - it: renders without API credentials
    template: templates/serviceaccounts.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dsx-imds
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: rejects a missing workload ServiceAccount name
    set:
      workload.serviceAccountName: ""
    template: templates/serviceaccounts.yaml
    asserts:
      - failedTemplate:
          errorMessage: workload.serviceAccountName is required
