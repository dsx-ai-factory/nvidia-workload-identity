apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "workload.serviceAccountName is required" .Values.workload.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-imds.labels" (dict "root" . "name" "dsx-imds") | nindent 4 }}
automountServiceAccountToken: false
