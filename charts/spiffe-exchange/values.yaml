enabled: true

namespace: dsx-spiffe

image:
  repository: nvcr.io/0837451325059433/components-dev/spiffe-exchange-service
  # tag defaults to Chart.Version (set by CI via helm package --version)
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ngc-ncp-registry-creds

replicas: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080

exchange:
  region: sjc-1
  baseDomain: nvidia.com
  logLevel: info
  keystoreBackend: postgres
  pgHost: spiffe-postgres-postgresql.dsx-spiffe.svc.cluster.local
  pgPort: "5432"
  pgDatabase: exchange
  pgUser: exchange
  pgPasswordSecret: spiffe-postgres-postgresql
  pgPasswordKey: password
  encryptionKeysetSecret: exchange-encryption-keyset

dbMigration:
  # Run DB schema migration as init container before exchange service starts.
  # This creates the domain_keys table if it doesn't exist (idempotent).
  enabled: true
  image:
    repository: docker.io/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

encryptionKeyset:
  # Auto-generate the encryption keyset secret via init Job if it doesn't exist
  autoGenerate: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

route:
  enabled: false
  # host: exchange.<cluster>.dsx.nvidia.com
  # gatewayName: gateway
  # gatewayNamespace: gateway
  # sectionName: exchange-service
