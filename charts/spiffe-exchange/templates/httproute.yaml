{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName | default "gateway" }}
      namespace: {{ .Values.route.gatewayNamespace | default "gateway" }}
      {{- if .Values.route.sectionName }}
      sectionName: {{ .Values.route.sectionName }}
      {{- end }}
  {{- if .Values.route.host }}
  hostnames:
    - {{ .Values.route.host }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
{{- end }}
