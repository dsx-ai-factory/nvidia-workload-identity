{{- if .Values.dbMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-db-migration
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    component: db-migration
  annotations:
    # ArgoCD PostSync hook — runs after all resources are synced and healthy
    # (PostgreSQL must be ready before this Job starts)
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: db-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-migration
        image: "{{ .Values.dbMigration.image.repository }}:{{ .Values.dbMigration.image.tag }}"
        imagePullPolicy: {{ .Values.dbMigration.image.pullPolicy | default "IfNotPresent" }}
        command: ["sh", "-c"]
        args:
        - |
          until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER"; do
            echo "Waiting for PostgreSQL at $PG_HOST:$PG_PORT..."
            sleep 2
          done
          echo "Running database migration..."
          PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" -f /migrations/init-schema.sql
          echo "Migration complete."
        env:
        - name: PG_HOST
          value: {{ tpl (.Values.exchange.pgHost | default "postgres") . | quote }}
        - name: PG_PORT
          value: {{ .Values.exchange.pgPort | default "5432" | quote }}
        - name: PG_USER
          value: {{ .Values.exchange.pgUser | default "exchange" | quote }}
        - name: PG_DATABASE
          value: {{ .Values.exchange.pgDatabase | default "exchange" | quote }}
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ tpl (.Values.exchange.pgPasswordSecret | default "postgres-app") . }}
              key: {{ .Values.exchange.pgPasswordKey | default "password" }}
        volumeMounts:
        - name: db-migration
          mountPath: /migrations
          readOnly: true
      volumes:
      - name: db-migration
        configMap:
          name: {{ .Chart.Name }}-db-migration
{{- end }}
