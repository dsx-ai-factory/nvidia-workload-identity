apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: metallb-k1
manifests:
  kustomize:
    paths:
      - ../scripts/k1/metallb
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - '--for=jsonpath={.subsets[0].addresses[0].ip}'
              - --context=kind-k1
              - --namespace=metallb-system
              - --timeout=120s
              - endpoints/metallb-webhook-service
        - host:
            command:
              - scripts/k1/metallb/configure-address-pool.sh
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: envoy-gateway-crds-k1
manifests:
  helm:
    releases:
      - name: eg-crds
        remoteChart: oci://docker.io/envoyproxy/gateway-crds-helm
        version: v1.5.4
        namespace: envoy-gateway-system
        createNamespace: true
        setValues:
          crds.gatewayAPI.enabled: true
          crds.gatewayAPI.channel: experimental
          crds.envoyGateway.enabled: true
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 60
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k1
              - --timeout=120s
              - crd/gatewayclasses.gateway.networking.k8s.io
              - crd/gateways.gateway.networking.k8s.io
              - crd/httproutes.gateway.networking.k8s.io
              - crd/tcproutes.gateway.networking.k8s.io
    flags:
      apply:
        - --server-side
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: envoy-gateway-k1
requires:
  - configs:
      - envoy-gateway-crds-k1
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  helm:
    flags:
      install:
        - --skip-crds
      upgrade:
        - --skip-crds
    releases:
      - name: eg
        remoteChart: oci://docker.io/envoyproxy/gateway-helm
        version: v1.5.4
        namespace: envoy-gateway-system
        createNamespace: true
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k1-gateway-resources
requires:
  - configs:
      - envoy-gateway-k1
      - metallb-k1
manifests:
  rawYaml:
    - ../scripts/k1/gateway/gateway-class.yaml
    - ../scripts/k1/gateway/gateway.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - scripts/configure-dns.sh
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: spire-crds-k1
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 60
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k1
              - --timeout=120s
              - crd/clusterspiffeids.spire.spiffe.io
    releases:
      - name: spire-crds
        remoteChart: spire-crds
        repo: https://spiffe.github.io/helm-charts-hardened/
        version: 0.5.0
        namespace: spire-system
        createNamespace: true
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: nats-k1
requires:
  # The dependency hook downloads the pinned chart before Skaffold renders this release.
  - path: dependencies.yaml
    configs:
      - chart-dependencies
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: nats
        chartPath: ../charts/nats-2.14.2.tgz
        namespace: dsx-identity
        createNamespace: true
        # Rendering must not rebuild the prepared archive from remote repositories.
        skipBuildDependencies: true
        valuesFiles:
          - ../scripts/k1/nats/values.yaml
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: nats-route-k1
requires:
  - configs:
      - k1-gateway-resources
      - nats-k1
manifests:
  rawYaml:
    - ../scripts/k1/nats/route.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-k1
requires:
  - path: images.yaml
    configs:
      - images
  - path: dependencies.yaml
    configs:
      - chart-dependencies
  - path: secrets.yaml
    configs:
      - identity-secrets-k1
  - configs:
      - nats-route-k1
      - spire-crds-k1
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - '--for=jsonpath={.subsets[0].addresses[0].ip}'
              - --context=kind-k1
              - --namespace=dsx-identity
              - --timeout=120s
              - endpoints/dsx-identity-controller-manager-webhook
    releases:
      - name: dsx-identity
        chartPath: ../charts/dsx-identity
        namespace: dsx-identity
        createNamespace: true
        skipBuildDependencies: true
        valuesFiles:
          - ../scripts/identity-e2e-values.yaml
          - ../scripts/k1-values.yaml
        setValueTemplates:
          identityKeys.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_identity_keys}}"
          identityKeys.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_identity_keys}}"
          podTokenFetcher.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_token_fetcher}}"
          podTokenFetcher.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_token_fetcher}}"
          spire.spire-server.image.registry: ""
          spire.spire-server.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_spire_server}}"
          spire.spire-server.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_spire_server}}"
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: worker-host-boundary-k1
requires:
  - path: images.yaml
    configs:
      - images
  - configs:
      - identity-k1
manifests:
  rawYaml:
    - ../scripts/k1/source-fixtures/operator-host-bootstrap.yaml
    - ../scripts/k1/dpu/e2e-nico-mds.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: worker-host-k1
requires:
  - path: images.yaml
    configs:
      - images
  - configs:
      - worker-host-boundary-k1
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: dsx-imds-host-agent
        remoteChart: spire
        repo: https://spiffe.github.io/helm-charts-hardened/
        version: 0.27.1
        namespace: dsx-identity
        valuesFiles:
          - ../scripts/dsx-imds-host-agent-values.yaml
          - ../scripts/k1/dsx-imds-host-agent-values.yaml
        setValueTemplates:
          spire-agent.image.registry: ""
          spire-agent.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_spire_agent}}"
          spire-agent.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_spire_agent}}"
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k1-fixture
requires:
  - path: images.yaml
    configs:
      - images
  - configs:
      - worker-host-k1
manifests:
  rawYaml:
    - ../scripts/k1/nginx/e2e-nginx.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: openbao-k1
requires:
  - configs:
      - identity-k1
      - k1-gateway-resources
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: openbao
        remoteChart: openbao
        repo: https://openbao.github.io/openbao-helm
        version: 0.27.1
        namespace: openbao
        createNamespace: true
        # Skaffold otherwise waits on the chart test hook, which Helm install does not run.
        skipTests: true
        valuesFiles:
          - ../scripts/k1/openbao/openbao-values.yaml
        setFiles:
          server.standalone.config: ../scripts/k1/openbao/openbao.hcl
          'extraObjects[1].data.region-ds9-policy\.hcl': ../scripts/k1/openbao/policies/region-ds9-policy.hcl
          'extraObjects[1].data.resource-type-dpu-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-dpu-policy.hcl
          'extraObjects[1].data.resource-type-bm-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-bm-policy.hcl
          'extraObjects[1].data.resource-type-vm-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-vm-policy.hcl
          'extraObjects[1].data.service-dsx-policy\.hcl': ../scripts/k1/openbao/policies/service-dsx-policy.hcl
          'extraObjects[1].data.spiffe-authenticated-policy\.hcl': ../scripts/k1/openbao/policies/spiffe-authenticated-policy.hcl
          'extraObjects[1].data.tenant-operator-1-policy\.hcl': ../scripts/k1/openbao/policies/tenant-operator-1-policy.hcl
          'extraObjects[1].data.tenant-tenant-2-policy\.hcl': ../scripts/k1/openbao/policies/tenant-tenant-2-policy.hcl
