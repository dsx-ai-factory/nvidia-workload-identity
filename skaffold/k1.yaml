apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: metallb-k1
manifests:
  kustomize:
    paths:
      - ../scripts/k1/metallb
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - scripts/k1/metallb/configure-address-pool.sh
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: envoy-gateway-crds-k1
manifests:
  helm:
    releases:
      - name: eg-crds
        remoteChart: oci://docker.io/envoyproxy/gateway-crds-helm
        version: v1.5.4
        namespace: envoy-gateway-system
        createNamespace: true
        setValues:
          crds.gatewayAPI.enabled: true
          crds.gatewayAPI.channel: experimental
          crds.envoyGateway.enabled: true
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 60
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k1
              - --timeout=120s
              - crd/gatewayclasses.gateway.networking.k8s.io
              - crd/gateways.gateway.networking.k8s.io
              - crd/httproutes.gateway.networking.k8s.io
              - crd/tcproutes.gateway.networking.k8s.io
    flags:
      apply:
        - --server-side
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: envoy-gateway-k1
requires:
  - configs:
      - envoy-gateway-crds-k1
manifests:
  helm:
    releases: &envoyGatewayK1Releases
      - name: eg
        remoteChart: oci://docker.io/envoyproxy/gateway-helm
        version: v1.5.4
        namespace: envoy-gateway-system
        createNamespace: true
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  helm:
    flags:
      install:
        - --skip-crds
      upgrade:
        - --skip-crds
    releases: *envoyGatewayK1Releases
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k1-gateway-resources
requires:
  - configs:
      - envoy-gateway-k1
      - metallb-k1
manifests:
  rawYaml:
    - ../scripts/k1/gateway/gateway-class.yaml
    - ../scripts/k1/gateway/gateway.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - scripts/configure-dns.sh
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: spire-crds-k1
manifests:
  helm:
    releases: &spireCrdsK1Releases
      - name: spire-crds
        remoteChart: spire-crds
        repo: https://spiffe.github.io/helm-charts-hardened/
        version: 0.5.0
        namespace: spire-system
        createNamespace: true
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 60
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k1
              - --timeout=120s
              - crd/clusterspiffeids.spire.spiffe.io
    releases: *spireCrdsK1Releases
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: keycloak-k1
requires:
  - path: secrets.yaml
    configs:
      - event-bus-secrets-k1
manifests:
  kustomize:
    paths:
      - ../scripts/k1/event-bus
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: event-bus-k1
requires:
  - path: dependencies.yaml
    configs:
      - chart-dependencies
  - path: images.yaml
    configs:
      - core-images
  - configs:
      - k1-gateway-resources
      - keycloak-k1
manifests:
  helm:
    releases: &eventBusReleases
      - name: event-bus
        chartPath: ../third-party/dsx-exchange/deploy/nats-event-bus
        namespace: dsx-identity
        createNamespace: true
        skipBuildDependencies: true
        valuesFiles:
          - ../scripts/k1/event-bus/values.yaml
        setValueTemplates:
          auth-callout.image.repository: "{{.IMAGE_REPO_dsx_identity_auth_callout}}"
          auth-callout.image.tag: "{{.IMAGE_TAG_dsx_identity_auth_callout}}"
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases: *eventBusReleases
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: event-bus-route-k1
requires:
  - configs:
      - k1-gateway-resources
      - keycloak-k1
manifests:
  rawYaml:
    - ../scripts/k1/event-bus/oauth-route.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-k1
requires:
  - path: images.yaml
    configs:
      - core-images
  - path: secrets.yaml
    configs:
      - identity-secrets-k1
  - configs:
      - event-bus-k1
      - keycloak-k1
      - spire-crds-k1
manifests:
  helm:
    releases: &k1IdentityReleases
      - name: dsx-identity
        chartPath: ../charts/dsx-identity
        namespace: dsx-identity
        createNamespace: true
        skipBuildDependencies: true
        valuesFiles:
          - ../scripts/k1-values.yaml
        setValueTemplates:
          exchange.image.repository: "{{.IMAGE_REPO_dsx_identity_spiffe_exchange_service}}"
          exchange.image.tag: "{{.IMAGE_TAG_dsx_identity_spiffe_exchange_service}}"
          podTokenFetcher.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_token_fetcher}}"
          podTokenFetcher.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_token_fetcher}}"
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases: *k1IdentityReleases
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k1-fixture
requires:
  - path: images.yaml
    configs:
      - e2e-images
  - configs:
      - identity-k1
manifests:
  rawYaml:
    - ../scripts/k1/nginx/e2e-nginx.yaml
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: openbao-k1
requires:
  - configs:
      - identity-k1
      - k1-gateway-resources
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: openbao
        remoteChart: openbao
        repo: https://openbao.github.io/openbao-helm
        version: 0.27.1
        namespace: openbao
        createNamespace: true
        # Skaffold otherwise waits on the chart test hook, which Helm install does not run.
        skipTests: true
        valuesFiles:
          - ../scripts/k1/openbao/openbao-values.yaml
        setFiles:
          server.standalone.config: ../scripts/k1/openbao/openbao.hcl
          'extraObjects[1].data.region-ds9-policy\.hcl': ../scripts/k1/openbao/policies/region-ds9-policy.hcl
          'extraObjects[1].data.resource-type-dpu-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-dpu-policy.hcl
          'extraObjects[1].data.resource-type-host-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-host-policy.hcl
          'extraObjects[1].data.resource-type-vm-policy\.hcl': ../scripts/k1/openbao/policies/resource-type-vm-policy.hcl
          'extraObjects[1].data.service-dsx-policy\.hcl': ../scripts/k1/openbao/policies/service-dsx-policy.hcl
          'extraObjects[1].data.spiffe-authenticated-policy\.hcl': ../scripts/k1/openbao/policies/spiffe-authenticated-policy.hcl
          'extraObjects[1].data.tenant-nca-0000000000000001-policy\.hcl': ../scripts/k1/openbao/policies/tenant-nca-0000000000000001-policy.hcl
