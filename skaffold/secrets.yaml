apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-secrets-k1
manifests:
  hooks:
    before:
      - host:
          command:
            - local-e2e-tests/prepare-signing-keyset-source.sh
            - kind-k1
            - local-e2e-tests/k1-values.yaml
            - local-e2e-tests/secret-generators/identity-k1/generated
  kustomize:
    paths:
      - ../local-e2e-tests/secret-generators/identity-k1
    buildArgs: &secretGeneratorBuildArgs
      - --load-restrictor=LoadRestrictionsNone
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-secrets-k2
manifests:
  hooks:
    before:
      - host:
          command:
            - local-e2e-tests/prepare-signing-keyset-source.sh
            - kind-k2
            - local-e2e-tests/k2-values.yaml
            - local-e2e-tests/secret-generators/identity-k2/generated
  kustomize:
    paths:
      - ../local-e2e-tests/secret-generators/identity-k2
    buildArgs: *secretGeneratorBuildArgs
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
