apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: event-bus-secret-sources
manifests:
  hooks:
    before:
      - host:
          command:
            - scripts/k1/event-bus/prepare-secret-sources.sh
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: event-bus-secrets-k1
requires:
  - configs:
      - event-bus-secret-sources
manifests:
  kustomize:
    paths:
      - ../scripts/secret-generators/event-bus
    buildArgs: &secretGeneratorBuildArgs
      - --load-restrictor=LoadRestrictionsNone
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-secrets-k1
manifests:
  hooks:
    before:
      - host:
          command:
            - scripts/prepare-signing-keyset-source.sh
            - kind-k1
            - scripts/k1-values.yaml
            - scripts/secret-generators/identity-k1/generated
  kustomize:
    paths:
      - ../scripts/secret-generators/identity-k1
    buildArgs: *secretGeneratorBuildArgs
deploy:
  kubeContext: kind-k1
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-secrets-k2
requires:
  - configs:
      - event-bus-secret-sources
manifests:
  hooks:
    before:
      - host:
          command:
            - scripts/prepare-signing-keyset-source.sh
            - kind-k2
            - scripts/k2-values.yaml
            - scripts/secret-generators/identity-k2/generated
  kustomize:
    paths:
      - ../scripts/secret-generators/identity-k2
    buildArgs: *secretGeneratorBuildArgs
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl: {}
