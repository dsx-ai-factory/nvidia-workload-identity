apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: core-images
build:
  local:
    concurrency: 0
    push: false
    useDockerCLI: true
    useBuildkit: true
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: dsx-identity/spiffe-exchange-service
      context: ..
      docker:
        dockerfile: Dockerfile
        target: spiffe-exchange-service
        buildArgs:
          <<: &coreBuildArgs
            BUILDER_IMG: 127.0.0.1:5002/library/golang:1.26.4
          BINARY: spiffe-exchange-service
    - image: dsx-identity/dsx-token-fetcher
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-token-fetcher
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-token-fetcher
    - image: dsx-identity/auth-callout
      context: ../third-party/dsx-exchange/auth-callout
      docker:
        dockerfile: build/package/Dockerfile
        buildArgs:
          BUILDER_IMG: 127.0.0.1:5002/library/golang
          FINAL_IMG: 127.0.0.1:5002/distroless/static-debian12
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k2-images
build:
  local:
    concurrency: 0
    push: false
    useDockerCLI: true
    useBuildkit: true
  tagPolicy:
