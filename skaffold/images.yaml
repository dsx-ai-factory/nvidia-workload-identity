apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: images
build:
  local:
    concurrency: 0
    push: false
    useDockerCLI: true
    useBuildkit: true
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: dsx-identity/dsx-identity-keys
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-keys
        buildArgs:
          <<: &coreBuildArgs
            BUILDER_IMG: 127.0.0.1:5002/docker.io/library/golang:1.26.10
          BINARY: dsx-identity-keys
    - image: dsx-identity/dsx-token-fetcher
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-token-fetcher
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-token-fetcher
    - image: dsx-identity/metadata-service
      context: ..
      docker:
        dockerfile: Dockerfile
        target: metadata-service
        buildArgs:
          <<: *coreBuildArgs
          BINARY: metadata-service
    - image: dsx-identity/dsx-spire-server
      context: ..
      docker:
        dockerfile: Dockerfile.spire
        target: dsx-spire-server
        # Use pinned GHCR bases from Dockerfile.spire to avoid cache lookup failures.
        buildArgs:
          <<: *coreBuildArgs
    - image: dsx-identity/dsx-spire-agent
      context: ..
      docker:
        dockerfile: Dockerfile.spire
        target: dsx-spire-agent
        buildArgs:
          <<: *coreBuildArgs
    - image: dsx-identity/dsx-imds-network-setup
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-imds-network-setup
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-imds-network-setup
    - image: dsx-identity/dsx-identity-keys-proxy-csi
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-keys-proxy-csi
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-identity-keys-proxy-csi
    - image: dsx-identity/dsx-identity-controller
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-controller
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-identity-controller
    - image: dsx-identity/e2e-probe
      context: ..
      docker:
        dockerfile: Dockerfile.e2e
        buildArgs:
          BUILDER_IMG: 127.0.0.1:5002/docker.io/library/golang:1.26.10
          RUNTIME_IMG: 127.0.0.1:5002/docker.io/curlimages/curl:8.10.1
