apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: images
build:
  local:
    concurrency: 0
    push: false
    useDockerCLI: true
    useBuildkit: true
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: dsx-identity/dsx-identity-keys
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-keys
        buildArgs:
          <<: &coreBuildArgs
            BUILDER_IMG: 127.0.0.1:5002/library/golang:1.26.4
          BINARY: dsx-identity-keys
    - image: dsx-identity/dsx-token-fetcher
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-token-fetcher
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-token-fetcher
    - image: dsx-identity/metadata-service
      context: ..
      docker:
        dockerfile: Dockerfile
        target: metadata-service
        buildArgs:
          <<: *coreBuildArgs
          BINARY: metadata-service
    - image: dsx-identity/dsx-imds-node-attestor-server
      context: ..
      docker:
        dockerfile: Dockerfile.plugin
        buildArgs:
          <<: &corePluginBuildArgs
            BUILDER_IMG: 127.0.0.1:5002/library/golang:1.26.4
            TOOLS_IMG: 127.0.0.1:5002/library/busybox:1.37.0-musl
          BINARY: dsx-imds-node-attestor-server
    - image: dsx-identity/dsx-imds-node-attestor-agent
      context: ..
      docker:
        dockerfile: Dockerfile.plugin
        buildArgs:
          <<: *corePluginBuildArgs
          BINARY: dsx-imds-node-attestor-agent
    - image: dsx-identity/dsx-imds-network-setup
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-imds-network-setup
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-imds-network-setup
    - image: dsx-identity/dsx-identity-keys-proxy-csi
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-keys-proxy-csi
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-identity-keys-proxy-csi
    - image: dsx-identity/dsx-identity-controller
      context: ..
      docker:
        dockerfile: Dockerfile
        target: dsx-identity-controller
        buildArgs:
          <<: *coreBuildArgs
          BINARY: dsx-identity-controller
    - image: dsx-identity/e2e-probe
      context: ..
      docker:
        dockerfile: Dockerfile.e2e
        buildArgs:
          BUILDER_IMG: 127.0.0.1:5002/library/golang:1.26.4
          RUNTIME_IMG: 127.0.0.1:5002/curlimages/curl:8.10.1
