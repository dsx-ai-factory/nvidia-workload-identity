apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: vm-k2
requires:
  - path: images.yaml
    configs:
      - images
  - path: k1.yaml
    configs:
      - identity-k1
  - configs:
      - kubevirt-k2-release
      - worker-host-k2
manifests:
  hooks:
    before:
      - host:
          command:
            - local-e2e-tests/k2/vm/prepare-secret-source.sh
  kustomize:
    paths:
      - ../local-e2e-tests/k2/vm
      - ../local-e2e-tests/k2/vm-ipv4
      - ../local-e2e-tests/k2/vm-ipv6
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      before:
        # KubeVirt pulls several large upstream images in sequence before reporting Available.
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Available
              - --namespace=kubevirt
              - --context=kind-k2
              - --timeout=600s
              - kubevirt/kubevirt
