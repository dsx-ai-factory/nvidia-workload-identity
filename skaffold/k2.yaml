apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: worker-host-k2
requires:
  - path: images.yaml
    configs:
      - images
  - configs:
      - worker-host-boundary-k2
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: dsx-imds-host-agent
        # VM sidecars use this agent's Workload API.
        wait: true
        remoteChart: spire
        repo: https://spiffe.github.io/helm-charts-hardened/
        version: 0.27.1
        namespace: dsx-identity
        valuesFiles:
          - ../local-e2e-tests/dsx-imds-host-agent-values.yaml
          - ../local-e2e-tests/k2/dsx-imds-host-agent-values.yaml
        setValueTemplates:
          spire-agent.image.registry: ""
          spire-agent.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_spire_agent}}"
          spire-agent.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_spire_agent}}"
---
