apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: k2-network-apis
manifests:
  kustomize:
    paths:
      - ../local-e2e-tests/k2/network
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 120
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k2
              - --timeout=120s
              - crd/network-attachment-definitions.k8s.cni.cncf.io
              - crd/multi-networkpolicies.k8s.cni.cncf.io
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: ovn-k2-release
requires:
  - configs:
      - k2-network-apis
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k2
              - --timeout=120s
              - crd/userdefinednetworks.k8s.ovn.org
    releases:
      - name: ovn-kubernetes
        chartPath: ../third-party/ovn-kubernetes/helm/ovn-kubernetes
        namespace: default
        skipBuildDependencies: true
        # Reapplying this chart restarts the node agent after it has moved eth0
        # into the OVN bridge, which makes the replacement unable to initialize.
        upgradeOnChange: false
        valuesFiles:
          - ../third-party/ovn-kubernetes/helm/ovn-kubernetes/values-no-ic.yaml
          - ../local-e2e-tests/k2/network/ovn-values.yaml
        setValues:
          k8sAPIServer: https://k2-control-plane:6443
          ovnkube-identity.replicas: 1
          global.image.repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-fedora
          global.image.tag: release-1.2@sha256:a960f93ab6a910ab6ef9ad7ac2afc84ea5399151964c4e85c765554aa3442b0b
          mtu: 1300
          global.enableMultiNetwork: true
          global.enableNetworkSegmentation: true
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: kubevirt-operator-k2
requires:
  - configs:
      - ovn-k2-release
manifests:
  kustomize:
    paths:
      - ../local-e2e-tests/k2/kubevirt/operator
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 180
  tolerateFailuresUntilDeadline: true
  kubectl:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k2
              - --timeout=120s
              - crd/kubevirts.kubevirt.io
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: kubevirt-k2-release
requires:
  - configs:
      - kubevirt-operator-k2
manifests:
  kustomize:
    paths:
      - ../local-e2e-tests/k2/kubevirt/release
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 600
  tolerateFailuresUntilDeadline: true
  kubectl: {}
---
apiVersion: skaffold/v4beta14
kind: Config
