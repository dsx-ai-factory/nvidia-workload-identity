---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: spire-crds-k2
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 60
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - --for=condition=Established
              - --context=kind-k2
              - --timeout=120s
              - crd/clusterspiffeids.spire.spiffe.io
    releases:
      - name: spire-crds
        remoteChart: spire-crds
        repo: https://spiffe.github.io/helm-charts-hardened/
        version: 0.5.0
        namespace: spire-system
        createNamespace: true
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: identity-k2
requires:
  - path: images.yaml
    configs:
      - images
  - path: dependencies.yaml
    configs:
      - chart-dependencies
  - path: secrets.yaml
    configs:
      - identity-secrets-k2
  - configs:
      - k2-source-apis
      # Native admission needs no deployment, so retain the direct network dependency.
      - ovn-k2-release
  - path: k1.yaml
    configs:
      - nats-route-k1
deploy:
  kubeContext: kind-k2
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    hooks:
      after:
        - host:
            command:
              - kubectl
              - wait
              - '--for=jsonpath={.subsets[0].addresses[0].ip}'
              - --context=kind-k2
              - --namespace=dsx-identity
              - --timeout=120s
              - endpoints/dsx-identity-controller-manager-webhook
    releases:
      - name: dsx-identity
        # Complete identity rollout before deploying dependent fixtures.
        wait: true
        chartPath: ../charts/dsx-identity
        namespace: dsx-identity
        createNamespace: true
        skipBuildDependencies: true
        valuesFiles:
          - ../local-e2e-tests/identity-e2e-values.yaml
          - ../local-e2e-tests/k2-values.yaml
        setValueTemplates:
          identityKeys.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_identity_keys}}"
          identityKeys.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_identity_keys}}"
          podTokenFetcher.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_token_fetcher}}"
          podTokenFetcher.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_token_fetcher}}"
          vmSupport.metadataService.image.repository: "{{.IMAGE_REPO_dsx_identity_metadata_service}}"
          vmSupport.metadataService.image.tag: "{{.IMAGE_TAG_dsx_identity_metadata_service}}"
          vmSupport.imdsNetworkSetup.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_imds_network_setup}}"
          vmSupport.imdsNetworkSetup.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_imds_network_setup}}"
          vmSupport.identityKeysProxyCsi.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_identity_keys_proxy_csi}}"
          vmSupport.identityKeysProxyCsi.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_identity_keys_proxy_csi}}"
          identityController.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_identity_controller}}"
          identityController.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_identity_controller}}"
          spire.spire-server.image.registry: ""
          spire.spire-server.image.repository: "{{.IMAGE_REPO_dsx_identity_dsx_spire_server}}"
          spire.spire-server.image.tag: "{{.IMAGE_TAG_dsx_identity_dsx_spire_server}}"
---
