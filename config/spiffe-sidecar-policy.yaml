apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-spiffe-jwt-sidecar
  annotations:
    policies.kyverno.io/title: Inject SPIFFE JWT Sidecar
    policies.kyverno.io/category: SPIFFE
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Automatically injects SPIFFE JWT sidecar container into pods with the 
      spiffe.nvidia.com/inject-sidecar annotation. The sidecar provides a 
      metadata endpoint at 169.254.169.254:8080 for JWT token retrieval.
spec:
  background: true
  rules:
  - name: add-spiffe-sidecar
    match:
      any:
      - resources:
          kinds: [Pod]
          annotations:
            spiffe.nvidia.com/inject-sidecar: "true"
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: spiffe-jwt-service
            image: nginxinc/nginx-unprivileged:alpine
            ports:
            - containerPort: 8080
            env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///var/run/secrets/spire.io/spire-agent.sock
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 50m
                memory: 64Mi
            volumeMounts:
            - name: spiffe-csi
              mountPath: /var/run/secrets/spire.io
              readOnly: true
          volumes:
          - name: spiffe-csi
            csi:
              driver: csi.spiffe.io
              readOnly: true
