apiVersion: v1
kind: Pod
metadata:
  name: test-metadata-bridge-csi
  namespace: default
spec:
  containers:
  - name: test
    image: busybox:latest
    command:
    - sh
    - -c
    - |
      echo "Testing CSI volume mount..."
      ls -la /metadata-bridge/
      echo "Creating test file in mounted volume..."
      touch /metadata-bridge/test-file.txt
      echo "Test successful!" > /metadata-bridge/test-file.txt
      cat /metadata-bridge/test-file.txt
      echo "Listing volume contents:"
      ls -la /metadata-bridge/
      echo "Sleeping indefinitely..."
      sleep infinity
    volumeMounts:
    - name: metadata-bridge
      mountPath: /metadata-bridge
  volumes:
  - name: metadata-bridge
    csi:
      driver: metadata-bridge.csi.nvidia.com
  restartPolicy: Never
