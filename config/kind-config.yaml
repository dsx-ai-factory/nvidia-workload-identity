kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: spire-demo
nodes:
- role: control-plane
  image: kindest/node:v1.31.9
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "spiffe.io/spire-node=true"

  extraPortMappings:
  - containerPort: 8081
    hostPort: 8081
    protocol: TCP
  - containerPort: 8443
    hostPort: 8443
    protocol: TCP
- role: worker
  image: kindest/node:v1.31.9
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "spiffe.io/spire-node=true"

networking:
  # WARNING: It is _strongly_ recommended that you keep this the default
  # (127.0.0.1) for security reasons. However it is possible to change this.
  apiServerAddress: "127.0.0.1"
  # By default the API server listens on a random open port.
  # You may choose a specific port but probably don't need to in most cases.
  # Using a random port makes it easier to spin up multiple clusters.
  apiServerPort: 6443
  # Pod and service network ranges match OVN-Kubernetes defaults (values-no-ic.yaml)
  # These must be consistent between Kind and OVN for networking to function
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # Disable default CNI and kube-proxy so OVN-Kubernetes can provide them
  disableDefaultCNI: true
  kubeProxyMode: none
