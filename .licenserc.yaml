header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: NVIDIA CORPORATION & AFFILIATES.
    content: |
      SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
      SPDX-License-Identifier: Apache-2.0
    pattern: |
      SPDX-FileCopyrightText: Copyright \(c\) [0-9]{4}(-[0-9]{4})? NVIDIA CORPORATION & AFFILIATES\. All rights reserved\.
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - '**/*.go'
    - '**/*.rs'
    - '**/*.sh'
    - '**/*.hcl'
    - '**/*.tpl'
    - '**/*.tmpl'
    - '**/*.jq'
    - '**/*.hbs'
    - '**/*.dockerignore'
    - '**/Dockerfile*'
    - Makefile
    - local-e2e-tests/k2/vm/networkdata
  paths-ignore:
    - third-party/**
    - kata-uds-proxy/Dockerfile.dockerignore
  comment: never
  language:
    Fixture:
      extensions: ['.tmpl', '.dockerignore', '.jq']
      filenames: [Makefile, networkdata]
      comment_style_id: Hashtag
    Dockerfile:
      filenames: [Dockerfile, Dockerfile.e2e, Dockerfile.spire]
      comment_style_id: Hashtag
