apiVersion: v1
kind: Namespace
metadata:
  name: dsx-identity-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-nginx
  namespace: dsx-identity-e2e
  annotations:
    spiffe.nvidia.com/inject-dsx-token-fetcher: "true"
    spiffe.nvidia.com/token-audience: spiffe://ds9.dsx.nvid.id/openbao
    spiffe.nvidia.com/token-fetcher-health-port: "18080"
  labels:
    app: e2e-nginx
    spiffe.nvidia.com/service: dsx
    spiffe.nvidia.com/role: web
spec:
  # Reduce ndots from default 5 to 2 to avoid slow DNS lookups.
  # With ndots:5, hostnames with <5 dots trigger search suffix expansion,
  # causing queries to forward to external DNS and timeout before resolving.
  dnsConfig:
    options:
      - name: ndots
        value: "2"
  containers:
    - name: nginx
      image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    - name: identity-probe
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
  restartPolicy: Never
