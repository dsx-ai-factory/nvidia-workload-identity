apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-tenant1
resources:
  - namespace.yaml
  - tenant-udn.yaml
  - external-client.yaml
  - vm.yaml
  - l2bridge.yaml
  - l2bridge-cloud-init.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: e2e-debian-vm-e2e-ssh
    files:
      - id_ed25519=generated/id_ed25519
      - id_ed25519.pub=generated/id_ed25519.pub
  - name: e2e-debian-vm-cloud-init
    files:
      - userdata=generated/userdata
      - networkdata=networkdata
