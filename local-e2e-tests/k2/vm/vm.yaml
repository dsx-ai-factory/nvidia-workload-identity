# KubeVirt maps this no-RBAC account onto the virt-launcher Pod through the
# vm-service-account volume below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-debian-vm
automountServiceAccountToken: false
---
apiVersion: launchlayer.nvidia.com/v1alpha1
kind: VirtualInstance
metadata:
  name: e2e-debian-vm
  annotations:
    launchlayer.nvidia.com/org-id: tenant-2
spec:
  instance_id: e2e-debian-vm
  node_name: k2-worker
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: e2e-debian-vm
  labels:
    app: e2e-vm
    kubevirt.io/vm: e2e-debian-vm
    tenant: tenant1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: e2e-debian-vm
        app: e2e-vm
        tenant: tenant1
        spiffe.nvidia.com/service: dsx
      annotations:
        spiffe.nvidia.com/inject-dsx-imds: "true"
        hooks.kubevirt.io/hookSidecars: '[{"args": ["--version", "v1alpha2"], "configMap":
          {"name": "e2e-l2bridge-cloud-init", "key": "preCloudInitIso", "hookPath":
          "/usr/bin/preCloudInitIso"}}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: k2-worker
      domain:
        cpu:
          cores: 1
        devices:
          # Match the Alpine RNG and headless defaults in KubeVirt E2E tests.
          # https://github.com/kubevirt/kubevirt/blob/v1.9.0/tests/libvmifact/factory.go#L87-L95
          # https://github.com/kubevirt/kubevirt/blob/v1.9.0/tests/testsuite/fixture.go#L179-L182
          rng: {}
          autoattachGraphicsDevice: false
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinit
            - disk:
                bus: virtio
                readonly: true
              # KubeVirt requires a disk target for the serviceAccount volume.
              name: vm-service-account
          interfaces:
            - name: default
              # Built-in bridge supplies DHCP for the CNI-assigned IPv4 address.
              # The cloud-init hook configures the CNI-assigned IPv6 address.
              bridge: {}
        features:
          acpi:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 160Mi
          limits:
            cpu: "1"
            # Replace the 32 MiB graphics allowance KubeVirt omits for headless VMs.
            memory: 192Mi
      networks:
        - name: default
          multus:
            # Multus default-network references require an explicit namespace.
            networkName: tenant-tenant1/tenant-tenant1-network
            default: true
      volumes:
        - containerDisk:
            image: quay.io/kubevirt/alpine-with-test-tooling-container-disk:v1.9.0@sha256:a6f3d9ffffa7d1e4cd19aa80aae21abfc09dd289db854b4098c7ed2e14e21b55
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: e2e-debian-vm-cloud-init
          name: cloudinit
        - name: vm-service-account
          serviceAccount:
            serviceAccountName: e2e-debian-vm
---
# Launch Layer normally publishes the virt-launcher Pod UID to VirtualInstance status.
# Keep this publisher on the dual-stack network so it can reach the IPv4 API
# service while registering VMs from all three network modes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-launch-layer-status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-launch-layer-status
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["launchlayer.nvidia.com"]
    resources: ["virtualinstances/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-launch-layer-status
subjects:
  - kind: ServiceAccount
    name: e2e-launch-layer-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-launch-layer-status
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-launch-layer-status
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: e2e-launch-layer-status
      containers:
        - name: status-publisher
          image: docker.io/alpine/k8s:1.32.2@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              failed=0
              for namespace in tenant-tenant1 tenant-tenant1-ipv4 tenant-tenant1-ipv6; do
                for vm in e2e-debian-vm e2e-debian-vm-l2bridge; do
                  if ! kubectl wait -n "$namespace" --for=create pod -l "kubevirt.io/domain=$vm" --timeout=300s; then
                    failed=1
                    continue
                  fi
                  if ! uid=$(kubectl get pod -n "$namespace" -l "kubevirt.io/domain=$vm" -o jsonpath='{.items[0].metadata.uid}'); then
                    failed=1
                    continue
                  fi
                  kubectl patch virtualinstance "$vm" -n "$namespace" --subresource=status --type=merge -p "{\"status\":{\"pod_uid\":\"$uid\"}}" || failed=1
                done
              done
              exit "$failed"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
