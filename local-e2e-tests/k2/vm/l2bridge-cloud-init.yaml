apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-l2bridge-cloud-init
data:
  # managedTap supplies no DHCP server. Configure the CNI-allocated guest addresses
  # through KubeVirt's upstream cloud-init hook for both families.
  # bridge uses DHCP for IPv4 and this hook for CNI-allocated IPv6.
  preCloudInitIso: |
    #!/usr/bin/env python3
    import argparse
    import json
    import ipaddress
    from pathlib import Path
    from time import monotonic, sleep

    parser = argparse.ArgumentParser()
    parser.add_argument("--vmi", required=True)
    parser.add_argument("--cloud-init", required=True)
    args = parser.parse_args()
    # The projection is mounted before CNI publishes the annotation.
    path = Path("/var/run/e2e-l2bridge/pod-networks")
    deadline = monotonic() + 60
    while True:
        status = path.read_text()
        if status:
            networks = json.loads(status)
            break
        if monotonic() >= deadline:
            raise RuntimeError("timed out waiting for OVN guest network")
        sleep(1)
    primary = [network for network in networks.values() if network.get("role") == "primary"]
    if len(primary) != 1:
        raise RuntimeError("expected one primary guest network")
    network = primary[0]
    vmi = json.loads(args.vmi)
    bridge = "bridge" in vmi["spec"]["domain"]["devices"]["interfaces"][0]
    ipv4 = any(ipaddress.ip_interface(address).version == 4
               for address in network["ip_addresses"])
    addresses = [address for address in network["ip_addresses"]
                 if not bridge or ipaddress.ip_interface(address).version == 6]
    routes = [{"to": "::/0" if ipaddress.ip_address(gateway).version == 6 else "0.0.0.0/0",
               "via": gateway}
              for gateway in network["gateway_ips"]
              if not bridge or ipaddress.ip_address(gateway).version == 6]
    data = json.loads(args.cloud_init)
    data["NetworkData"] = json.dumps({
        "version": 2,
        "ethernets": {
            "primary": {
                "match": {"macaddress": network["mac_address"]},
                "dhcp4": bridge and ipv4,
                "addresses": addresses,
                "routes": routes,
            }
        },
    })
    print(json.dumps(data))
