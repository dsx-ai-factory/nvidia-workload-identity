apiVersion: v1
kind: Pod
metadata:
  name: e2e-dpu-imds-probe
  namespace: dsx-identity
spec:
  nodeSelector:
    kubernetes.io/hostname: k2-worker
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: imds-probe
      image: dsx-identity/e2e-probe:0.1.0
      imagePullPolicy: IfNotPresent
      command: [tail, -f, /dev/null]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
