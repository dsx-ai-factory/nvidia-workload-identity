# Kind cluster configuration for the k2 Data Hall
# Uses OVN-Kubernetes CNI for UDN support required by metadata-service and VM Pods.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k2
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
# Native MutatingAdmissionPolicy is stable and enabled by default in 1.36.
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "spiffe.io/spire-node=true"
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        registryPullQPS: 0
        serializeImagePulls: false
        maxParallelImagePulls: 4
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "spiffe.io/spire-node=true"
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        registryPullQPS: 0
        serializeImagePulls: false
        maxParallelImagePulls: 4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
  # Dual-stack OVN networking gives the VM UDN an IPv6 allocation.
  ipFamily: dual
  # Pod and service ranges match the OVN Helm values in ../network/ovn-values.yaml.
  podSubnet: "10.244.0.0/16,fd00:10:244::/48"
  serviceSubnet: "10.96.0.0/16,fd00:10:96::/112"
  # Disable default CNI and kube-proxy so OVN-Kubernetes can provide them
  disableDefaultCNI: true
  kubeProxyMode: none
