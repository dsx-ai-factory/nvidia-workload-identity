# E2E definitions for the Launch Layer APIs consumed by NVIDIA Workload Identity.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualinstances.launchlayer.nvidia.com
spec:
  group: launchlayer.nvidia.com
  scope: Namespaced
  names:
    plural: virtualinstances
    singular: virtualinstance
    kind: VirtualInstance
    listKind: VirtualInstanceList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                instance_id:
                  type: string
                node_name:
                  type: string
            status:
              type: object
              properties:
                pod_uid:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: baremetalinstances.launchlayer.nvidia.com
spec:
  group: launchlayer.nvidia.com
  scope: Namespaced
  names:
    plural: baremetalinstances
    singular: baremetalinstance
    kind: BareMetalInstance
    listKind: BareMetalInstanceList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                instance_id:
                  type: string
            status:
              type: object
              properties:
                primary_dpu:
                  type: object
                  properties:
                    machine_id:
                      type: string
                    serial_number:
                      type: string
