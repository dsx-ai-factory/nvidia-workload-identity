server:
  updateStrategyType: RollingUpdate

  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

  extraSecretEnvironmentVars:
    - envName: OPENBAO_STATIC_SEAL_KEY
      secretName: openbao-static-seal
      secretKey: current-key

  volumes:
    - name: policies
      configMap:
        name: openbao-policies

  volumeMounts:
    - name: policies
      mountPath: /openbao/policies
      readOnly: true

  gateway:
    httpRoute:
      enabled: true
      hosts:
        - gateway.sjc-1.nvidia.com
      parentRefs:
        - name: k1-gateway
          namespace: envoy-gateway-system
          sectionName: openbao

injector:
  enabled: false

extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: openbao-static-seal
    stringData:
      current-key: dsx-identity-e2e-static-key-v1!!
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: openbao-policies
    data: {}
