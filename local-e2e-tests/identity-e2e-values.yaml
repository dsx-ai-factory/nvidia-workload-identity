# Settings shared by every local E2E identity shard.
global:
  operatorTenant: operator-1

# Local E2E has no collector.
observability:
  env:
    OTEL_SDK_DISABLED: "true"
  metrics:
    enabled: false

# Local E2E emulates the DPU boundary without the DPF DPUService API.
dpuService:
  imds:
    enabled: false

spire:
  spire-server:
    image:
      registry: ""
      repository: dsx-identity/dsx-spire-server
      tag: 0.1.0
    persistence:
      size: 256Mi
    defaultX509SvidTTL: "5m"
    extraEnv:
      - name: OTEL_SDK_DISABLED
        value: "true"
    customPlugins:
      nodeAttestor:
        dsx_imds:
          plugin_cmd: /opt/spire/plugins/dsx-imds-node-attestor-server
          plugin_checksum: ""
          plugin_data:
            jwks_url: http://dsx-identity-keys.dsx-identity.svc.cluster.local:8080/.well-known/jwks.json
        dpu_hw:
          plugin_cmd: /opt/spire/plugins/dsx-dpu-node-attestor-server
          plugin_checksum: ""
          plugin_data: {}
    controllerManager:
      extraEnv:
        - name: OPERATOR_TENANT
          value: operator-1
  # This agent on the Kind seed node emulates the external DPU boundary.
  spire-agent:
    enabled: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  spiffe-csi-driver:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

identityKeys:
  replicas: 1
  # The seed node emulates the external DPU execution boundary.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # The external E2E test process reaches DSX Identity Keys through the Kind node.
  service:
    type: NodePort
    nodePort: 30080
  jwksURL: http://dsx-identity-keys.dsx-identity.svc.cluster.local:8080/.well-known/jwks.json
