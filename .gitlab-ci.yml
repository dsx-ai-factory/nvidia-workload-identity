include:
  - project: cds/cicd-pipelines
    ref: 2.0.7
    file: /templates/pipeline.yml
  - local: .gitlab/ci/artifacts.yml
    rules:
      - if: '$GITLAB_PUBLISH_ARTIFACTS == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$/'
  - local: .gitlab/ci/release.yml

variables:
  GITLAB_PUBLISH_ARTIFACTS: "false"
  PUSH_TO_NGC: "false"
  NEED_SEMANTIC_RELEASE: "false"
  SONAR_PROJECT_KEY: NBUSW_DSX_DSX_nvidia-workload-identity
  SONAR_PROJECT_VAULT_KEY: nvidia-workload-identity
  RC_VERSION:
    value: ""
    description: "QA-approved X.Y.Z-rc.N to promote from the protected default branch."
  RELEASE_PREFLIGHT:
    value: "false"
    options: ["false", "true"]
    description: "Check the GitLab release runner tools without publishing artifacts."

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH'
    - if: '$GITLAB_PUBLISH_ARTIFACTS == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$/'

sonarqube:
  extends: [.sonarqube-scan]
  image:
    name: sonarsource/sonar-scanner-cli:5.0@sha256:02372948eaeeb10dfbe0cfd4174d44b8e405d0aeae431532b2bdb21d0347bf23
    entrypoint: [""]
  allow_failure: true
  needs: []
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
  script:
    - >-
      sonar-scanner
      -Dsonar.host.url=https://sonar.nvidia.com
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.projectVersion="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      -Dsonar.scm.revision="$CI_COMMIT_SHA"
      -Dsonar.sources=cmd,internal,kata-uds-proxy/src
      -Dsonar.tests=cmd,internal
      '-Dsonar.test.inclusions=**/*_test.go'
      '-Dsonar.exclusions=**/*_test.go'
      -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH'

cds-pulse-unused:
  rules:
    - when: never

cds-pulse-oss-unused:
  rules:
    - when: never

check-envvars:
  rules:
    - when: never
