apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-cpu-template  # Change this name for each deployment
  namespace: default
spec:
  dataVolumeTemplates:
  - metadata:
      name: ubuntu-rootdisk  # Change this for each deployment
    spec:
      source:
        registry:
          url: docker://quay.io/containerdisks/ubuntu:22.04
      storage:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
        volumeMode: Filesystem
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: ubuntu-cpu-template  # Change this for each deployment
    spec:
      domain:
        cpu:
          cores: 8
        devices:
          disks:
          - disk:
              bus: virtio
            name: rootdisk
          - disk:
              bus: virtio
            name: cloudinit
          interfaces:
          - masquerade: {}
            name: default
        features:
          acpi:
            enabled: true
          kvm:
            hidden: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
        resources:
          requests:
            memory: 16Gi
      networks:
      - name: default
        pod: {}
      volumes:
      - dataVolume:
          name: ubuntu-rootdisk  # Change this for each deployment
        name: rootdisk
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            users:
              - name: ubuntu
                sudo: ALL=(ALL) NOPASSWD:ALL
                lock_passwd: false
                plain_text_passwd: ubuntu
            package_update: true
            package_upgrade: true
            package_reboot_if_required: true
            packages:
              - linux-image-generic-hwe-22.04
              - linux-headers-generic-hwe-22.04
              - cpp-12
              - curl
              - wget
              - git
              - vim
              - htop
            growpart:
              mode: auto
              devices: ['/']
            runcmd:
              - apt-get update
              - apt-get -y upgrade
              - systemctl enable ssh
        name: cloudinit
