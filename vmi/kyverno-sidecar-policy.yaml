apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-sidecar-to-virt-launcher
  annotations:
    policies.kyverno.io/title: Add Sidecar to Virt-Launcher Pods
    policies.kyverno.io/category: KubeVirt
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy adds a monitoring sidecar container to Pods labeled with kubevirt.io=virt-launcher.
      The sidecar can be used for logging, monitoring, or other auxiliary functions for KubeVirt VMs.
spec:
  background: true
  rules:
  - name: add-monitoring-sidecar
    match:
      any:
      - resources:
          kinds:
          - Pod
          selector:
            matchLabels:
              kubevirt.io: virt-launcher
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: monitoring-sidecar
            image: busybox:1.35
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh"]
            args: ["-c", "while true; do echo 'Monitoring virt-launcher pod'; sleep 30; done"]
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "64Mi"
                cpu: "50m"
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            volumeMounts:
            - name: shared-logs
              mountPath: /var/log/shared
          volumes:
          - name: shared-logs
            emptyDir: {}
